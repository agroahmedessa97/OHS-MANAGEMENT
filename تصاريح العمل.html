<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصاريح العمل (PTW)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Cairo', 'sans-serif'] },
                        colors: {
                            emerald: { 50:'#eff8ff',100:'#dbeefe',200:'#bfe0fc',300:'#8fc7f8',400:'#5aa8ef',500:'#3a8be0',600:'#2468c4',700:'#1b4fa0',800:'#173f80',900:'#12306b',950:'#0b2150' },
                            slate: { 50:'#f4f8fd',100:'#e8f0fa',200:'#d3e0f0',300:'#b3c6de',400:'#8499b8',500:'#5f7497',600:'#475b7e',700:'#2f4468',800:'#16295a',900:'#0d2154',950:'#071538' }
                        }
                    }
                }
            };
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(180deg,#f3f9ff 0%,#e6f1fc 100%) fixed; color: #0d2154; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #dbeafe; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        .card-shadow { box-shadow: 0 4px 18px rgba(36,104,196,.08); }
    </style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- الشريط العلوي لوحدة تصاريح العمل فقط -->
    <header id="app-header" class="bg-slate-900 text-white sticky top-0 z-20 px-4 sm:px-6 py-3.5 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/25 border border-blue-400/40 text-blue-300 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-file-signature"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold">تصاريح العمل (PTW)</h1>
                    <p class="text-[11px] text-slate-300">إرشادات للمبتدئين • تسجيل وقت البداية والنهاية وحساب المدة تلقائياً • تعديل وحذف التصاريح</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button type="button" onclick="openPermitModal()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-plus ml-1"></i>إصدار تصريح عمل جديد
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="main-content" class="max-w-5xl mx-auto p-4 sm:p-6"></main>

    <!-- النافذة المنبثقة -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden my-auto">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900">عنوان</h3>
                <button type="button" onclick="closeModal()" class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-red-600 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 id="confirm-title" class="text-lg font-extrabold text-slate-900 mb-2">تأكيد</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeConfirmModal(false)" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">إلغاء</button>
                <button type="button" onclick="closeConfirmModal(true)" class="px-5 py-2 rounded-xl bg-red-600 text-white font-bold text-sm">تأكيد</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_PERMITS = 'ohs_module_work_permits_clean_v1';

        const PERMIT_TYPES = [
            'أعمال ساخنة / لحام',
            'عمل على ارتفاعات',
            'أعمال كهربائية',
            'أماكن محصورة',
            'أعمال كيميائية',
            'صيانة ميكانيكية'
        ];

        const PPE_ITEMS = [
            { id: 'helmet', label: 'خوذة أمان' },
            { id: 'glasses', label: 'نظارة واقية' },
            { id: 'faceshield', label: 'واقي وجه / لحام' },
            { id: 'work_gloves', label: 'قفازات عمل' },
            { id: 'elec_gloves', label: 'قفازات عازلة للكهرباء' },
            { id: 'chem_gloves', label: 'قفازات مقاومة للكيماويات' },
            { id: 'shoes', label: 'حذاء أمان' },
            { id: 'harness', label: 'حزام أمان للارتفاعات' },
            { id: 'ear', label: 'واقي أذن' },
            { id: 'respirator', label: 'كمامة حماية' },
            { id: 'vest', label: 'سترة عاكسة' },
            { id: 'apron', label: 'مريلة واقية' }
        ];

        // إرشادات مبسطة للمبتدئين حسب نوع تصريح العمل
        const PERMIT_GUIDANCE = {
            'أعمال ساخنة / لحام': {
                recommendedPpe: ['واقي وجه / لحام', 'قفازات عمل', 'حذاء أمان', 'مريلة واقية'],
                tips: [
                    'أبعد أي مواد قابلة للاشتعال أو زيوت أو كراتين لمسافة آمنة أو غطّها ببطانيات مقاومة للحريق.',
                    'وفّر طفاية حريق مناسبة وجاهزة في مكان العمل وتابع المنطقة بعد انتهاء اللحام بوقت كافٍ تحسباً لأي شرارة متأخرة.',
                    'تأكد من وجود تهوية كافية لتصريف أبخرة اللحام وعدم العمل في مكان مغلق بدون تهوية.'
                ]
            },
            'عمل على ارتفاعات': {
                recommendedPpe: ['خوذة أمان', 'حزام أمان للارتفاعات', 'حذاء أمان', 'سترة عاكسة'],
                tips: [
                    'تأكد من سلامة السلم أو السقالة أو منصة العمل وثباتها على أرضية مستوية قبل الصعود.',
                    'اربط حزام الأمان في نقطة تثبيت قوية وثابتة، ولا تترك أدوات مفكوكة قد تسقط على من يعمل بالأسفل.',
                    'ضع حواجز أو شريط تحذير أسفل منطقة العمل لمنع مرور الأشخاص تحت الشغل.'
                ]
            },
            'أعمال كهربائية': {
                recommendedPpe: ['خوذة أمان', 'نظارة واقية', 'قفازات عازلة للكهرباء', 'حذاء أمان'],
                tips: [
                    'افصل التيار الكهربائي وأمّن العزل والغلق (LOTO) وتأكد بعدم وجود جهد قبل لمس أي كابل أو لوحة.',
                    'تأكد من جفاف مكان العمل ويديك، واستخدم عدداً معزولة ومناسبة للعمل الكهربائي.',
                    'لا تترك أي كابل مكشوفاً أو موصلاً بدون عزل آمن بعد الانتهاء.'
                ]
            },
            'أماكن محصورة': {
                recommendedPpe: ['خوذة أمان', 'حزام أمان للارتفاعات', 'كمامة حماية', 'حذاء أمان'],
                tips: [
                    'لا تدخل أي مكان محصور (خزان، بيارة، غرفة مغلقة) إلا بعد فحص الجو والتهوية والتأكد من أمان الدخول.',
                    'وفّر مراقباً خارجياً متابعاً باستمرار طوال فترة العمل مع وسيلة تواصل واضحة وخطة إنقاذ.',
                    'التزم بفترات راحة وتهوية منتظمة وتجنب العمل المنفرد داخل المكان.'
                ]
            },
            'أعمال كيميائية': {
                recommendedPpe: ['نظارة واقية', 'واقي وجه / لحام', 'قفازات مقاومة للكيماويات', 'كمامة حماية', 'مريلة واقية', 'حذاء أمان'],
                tips: [
                    'اعرف اسم المادة والاحتياطات المدونة في صحيفة بيانات السلامة (SDS) قبل بدء التعامل معها.',
                    'تأكد من توفر تهوية جيدة ومكان لغسل العين أو الجسم في حال حدوث رذاذ أو انسكاب.',
                    'احفظ المواد الكيميائية في عبوات مغلقة ومكتوب عليها بوضوح، ولا تخلط مواد مع بعضها إلا بتعليمات واضحة.'
                ]
            },
            'صيانة ميكانيكية': {
                recommendedPpe: ['خوذة أمان', 'نظارة واقية', 'قفازات عمل', 'واقي أذن', 'حذاء أمان'],
                tips: [
                    'أوقف الماكينة تماماً وانتظر توقف الأجزاء المتحركة بالكامل وفصل الطاقة قبل فك أي غطاء أو جزء.',
                    'أعد تركيب كل حواجز الحماية (Guards) في مكانها الصحيح قبل إعادة تشغيل المعدة.',
                    'تأكد من عدم ترك أي مفاتيح أو قطع غيار أو أدوات داخل الماكينة قبل التجربة.'
                ]
            }
        };

        function loadPermitsState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_PERMITS);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        permits: Array.isArray(parsed.permits) ? parsed.permits : []
                    };
                }
            } catch (e) {}
            return { permits: [] };
        }

        let permitState = loadPermitsState();
        let confirmCallback = null;

        function savePermitsState() {
            try {
                localStorage.setItem(STORAGE_KEY_PERMITS, JSON.stringify(permitState));
            } catch (e) {
                showToast('تعذر الحفظ المحلي بالمتصفح', 'error');
            }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ==================== حساب المدة المستغرقة تلقائياً بين وقت البداية ووقت النهاية ====================
        function calculateDurationSummary(startDate, startTime, endDate, endTime) {
            if (!startDate || !startTime || !endDate || !endTime) {
                return 'لم يُسجَّل وقت الانتهاء بعد (جاري التنفيذ)';
            }
            const startObj = new Date(`${startDate}T${startTime}:00`);
            const endObj = new Date(`${endDate}T${endTime}:00`);
            if (isNaN(startObj.getTime()) || isNaN(endObj.getTime())) {
                return 'تاريخ أو وقت غير مكتمل';
            }
            const diffMs = endObj.getTime() - startObj.getTime();
            if (diffMs < 0) {
                return 'تنبيه: وقت النهاية أقدم من وقت البداية — راجع التاريخ والوقت';
            }
            const totalMinutes = Math.floor(diffMs / 60000);
            const days = Math.floor(totalMinutes / (60 * 24));
            const remMinutesAfterDays = totalMinutes % (60 * 24);
            const hours = Math.floor(remMinutesAfterDays / 60);
            const minutes = remMinutesAfterDays % 60;

            const parts = [];
            if (days > 0) parts.push(`${days} ${days === 1 ? 'يوم' : 'أيام'}`);
            if (hours > 0) parts.push(`${hours} ${hours === 1 ? 'ساعة' : 'ساعات'}`);
            if (minutes > 0 || parts.length === 0) parts.push(`${minutes} ${minutes === 1 ? 'دقيقة' : 'دقائق'}`);

            return `المدة المستغرقة: ${parts.join(' و ')}`;
        }

        // ==================== عرض قائمة تصاريح العمل ====================
        function renderPermits() {
            const totalCount = permitState.permits.length;
            const completedCount = permitState.permits.filter(p => p.endDate && p.endTime).length;
            const ongoingCount = totalCount - completedCount;

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl p-4 border card-shadow mb-4 flex flex-wrap justify-between items-center gap-3">
                    <div class="flex flex-wrap items-center gap-2 text-xs">
                        <span class="font-extrabold text-slate-800 text-sm">إجمالي تصاريح العمل: ${totalCount}</span>
                        <span class="px-2.5 py-1 rounded-full bg-amber-50 text-amber-900 border border-amber-200 font-bold">قيد التنفيذ: ${ongoingCount}</span>
                        <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-900 border border-emerald-200 font-bold">مكتملة (تم تسجيل النهاية): ${completedCount}</span>
                    </div>
                    <button type="button" onclick="openPermitModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-plus ml-1"></i>إصدار تصريح عمل جديد
                    </button>
                </div>

                <div class="space-y-3">
                    ${permitState.permits.map(p => {
                        const isDone = Boolean(p.endDate && p.endTime);
                        const durationText = calculateDurationSummary(p.startDate, p.startTime, p.endDate, p.endTime);
                        const ppeList = Array.isArray(p.ppe) ? p.ppe : [];

                        return `
                            <div class="bg-white rounded-2xl p-4 sm:p-5 border card-shadow text-xs space-y-3">
                                <div class="flex flex-wrap justify-between items-center gap-2">
                                    <div class="flex flex-wrap items-center gap-2">
                                        <span class="font-mono font-extrabold bg-slate-900 text-white px-2.5 py-1 rounded">${escapeHtml(p.id)}</span>
                                        <span class="px-2.5 py-1 rounded-full bg-blue-100 text-blue-900 border border-blue-200 font-extrabold">${escapeHtml(p.type)}</span>
                                        <span class="px-2.5 py-1 rounded-full font-extrabold ${isDone ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-amber-100 text-amber-900 border border-amber-200'}">
                                            ${isDone ? 'منتهي / مكتمل' : 'جاري العمل'}
                                        </span>
                                    </div>
                                    <div class="text-slate-600 font-bold">
                                        الموقع: <strong class="text-slate-900">${escapeHtml(p.location)}</strong>
                                        ${p.executor ? ` • المنفذ: <strong class="text-slate-900">${escapeHtml(p.executor)}</strong>` : ''}
                                    </div>
                                </div>

                                <div class="bg-slate-50 rounded-xl p-3 border grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                                    <div>
                                        <span class="text-slate-500">وقت البداية:</span>
                                        <strong class="font-mono text-slate-900 mr-1">${escapeHtml(p.startDate || '-')} ${escapeHtml(p.startTime || '')}</strong>
                                    </div>
                                    <div>
                                        <span class="text-slate-500">وقت النهاية:</span>
                                        <strong class="font-mono text-slate-900 mr-1">${isDone ? `${escapeHtml(p.endDate)} ${escapeHtml(p.endTime)}` : 'لم يُسجَّل بعد'}</strong>
                                    </div>
                                    <div>
                                        <span class="px-2.5 py-1 rounded-lg font-extrabold inline-block ${isDone ? 'bg-emerald-100 text-emerald-900' : 'bg-blue-50 text-blue-900'}">
                                            <i class="fa-solid fa-stopwatch ml-1"></i>${escapeHtml(durationText)}
                                        </span>
                                    </div>
                                </div>

                                ${ppeList.length ? `
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        <span class="font-bold text-slate-600 ml-1">مهمات الوقاية (PPE):</span>
                                        ${ppeList.map(item => `<span class="px-2 py-0.5 rounded-lg bg-slate-100 border text-slate-800 font-semibold">${escapeHtml(item)}</span>`).join('')}
                                    </div>
                                ` : ''}

                                ${p.notes ? `
                                    <div class="text-slate-700 bg-blue-50/50 p-2.5 rounded-xl border border-blue-100">
                                        <strong>ملاحظات:</strong> ${escapeHtml(p.notes)}
                                    </div>
                                ` : ''}

                                <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t">
                                    <button type="button" onclick="deletePermit('${escapeHtml(p.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold transition">
                                        <i class="fa-solid fa-trash-can ml-1"></i>حذف التصريح
                                    </button>
                                    <div class="flex flex-wrap gap-2">
                                        ${!isDone ? `
                                            <button type="button" onclick="openFinishPermitTimeModal('${escapeHtml(p.id)}')" class="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold transition">
                                                <i class="fa-solid fa-flag-checkered ml-1"></i>تسجيل وقت انتهاء الشغل
                                            </button>
                                        ` : ''}
                                        <button type="button" onclick="openPermitModal('${escapeHtml(p.id)}')" class="px-3.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-500 text-amber-900 hover:text-white border border-amber-200 font-bold transition">
                                            <i class="fa-solid fa-pen-to-square ml-1"></i>تعديل التصريح
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') || `
                        <div class="bg-white rounded-2xl p-10 text-center text-slate-500 text-xs border card-shadow space-y-3">
                            <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl mx-auto">
                                <i class="fa-solid fa-file-signature"></i>
                            </div>
                            <div class="font-extrabold text-sm text-slate-800">لا توجد تصاريح عمل مسجلة حالياً</div>
                            <p>اضغط على <strong>"إصدار تصريح عمل جديد"</strong> لاختيار نوع العمل، والاطلاع على إرشادات السلامة ومهمات الوقاية للمبتدئين، وتسجيل وقت البداية.</p>
                        </div>
                    `}
                </div>
            `;
        }

        // ==================== إرشادات المبتدئين وتحديد مهمات الوقاية تلقائياً عند اختيار نوع التصريح ====================
        function applyPermitTypeGuidance(typeVal, shouldAutoSelectPpe = true) {
            const box = document.getElementById('permit-beginner-guidance');
            const form = document.getElementById('permit-form');
            if (!box) return;

            const info = PERMIT_GUIDANCE[typeVal] || {
                recommendedPpe: ['خوذة أمان', 'نظارة واقية', 'حذاء أمان'],
                tips: ['تأكد من تأمين مكان العمل وتوافر مهمات الوقاية المناسبة قبل البدء.']
            };

            box.innerHTML = `
                <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3.5 space-y-2 text-xs">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="font-extrabold text-blue-950"><i class="fa-solid fa-lightbulb ml-1 text-amber-500"></i>إرشادات سريعة للمبتدئين (${escapeHtml(typeVal)}):</span>
                        <span class="text-[11px] font-bold text-blue-800">مهمات مقترحة: ${escapeHtml(info.recommendedPpe.join(' • '))}</span>
                    </div>
                    <ul class="space-y-1.5 text-slate-800 pr-4 list-disc leading-relaxed">
                        ${info.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}
                    </ul>
                </div>
            `;

            if (shouldAutoSelectPpe && form) {
                const boxes = form.querySelectorAll('input[name="ppe[]"]');
                boxes.forEach(cb => {
                    cb.checked = info.recommendedPpe.includes(cb.value);
                });
            }
        }

        // ==================== حساب مدة الشغل لحظياً داخل نافذة الإضافة أو التعديل ====================
        function updatePermitModalDurationPreview() {
            const form = document.getElementById('permit-form');
            const previewEl = document.getElementById('permit-duration-live');
            if (!form || !previewEl) return;

            const sDate = form.querySelector('[name="startDate"]')?.value || '';
            const sTime = form.querySelector('[name="startTime"]')?.value || '';
            const eDate = form.querySelector('[name="endDate"]')?.value || '';
            const eTime = form.querySelector('[name="endTime"]')?.value || '';

            previewEl.textContent = calculateDurationSummary(sDate, sTime, eDate, eTime);
        }

        // ==================== نافذة إصدار أو تعديل تصريح العمل ====================
        function openPermitModal(permitId = null) {
            const ed = permitId ? permitState.permits.find(x => x.id === permitId) : null;
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const nowTimeStr = now.toTimeString().slice(0, 5);

            const typeVal = ed ? ed.type : PERMIT_TYPES[0];
            const startDateVal = ed ? (ed.startDate || todayStr) : todayStr;
            const startTimeVal = ed ? (ed.startTime || nowTimeStr) : nowTimeStr;
            const endDateVal = ed ? (ed.endDate || '') : '';
            const endTimeVal = ed ? (ed.endTime || '') : '';
            const selectedPpe = ed && Array.isArray(ed.ppe) ? ed.ppe : [];

            openModal(ed ? `تعديل تصريح العمل (${ed.id})` : 'إصدار تصريح عمل جديد', `
                <form id="permit-form" class="space-y-4 text-xs" dir="rtl">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold mb-1">نوع تصريح العمل *</label>
                            <select name="type" onchange="applyPermitTypeGuidance(this.value, true)" class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-extrabold">
                                ${PERMIT_TYPES.map(t => `<option value="${escapeHtml(t)}" ${typeVal === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">الموقع / القسم *</label>
                            <input name="location" value="${ed ? escapeHtml(ed.location) : ''}" required placeholder="مثال: خط الإنتاج 1 / سطح المبنى" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
                        </div>
                    </div>

                    <!-- إرشادات مبسطة للمبتدئين تتغير حسب اختيار نوع التصريح -->
                    <div id="permit-beginner-guidance"></div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold mb-1">الجهة أو الشخص المنفذ للعمل (اختياري)</label>
                            <input name="executor" value="${ed ? escapeHtml(ed.executor || '') : ''}" placeholder="مثال: فريق الصيانة / مقاول اللحام" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ملاحظات إضافية (اختياري)</label>
                            <input name="notes" value="${ed ? escapeHtml(ed.notes || '') : ''}" placeholder="أي تفاصيل إضافية عن مكان أو طبيعة العمل" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
                        </div>
                    </div>

                    <!-- وقت البداية ووقت النهاية + حساب المدة تلقائياً -->
                    <div class="bg-slate-50 p-3.5 rounded-2xl border space-y-3">
                        <div class="font-extrabold text-slate-900"><i class="fa-solid fa-clock ml-1 text-blue-600"></i>توقيت بدء وانتهاء الشغل وحساب المدة تلقائياً:</div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div class="bg-white p-2.5 rounded-xl border space-y-2">
                                <div class="font-bold text-emerald-800">وقت البداية:</div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-0.5">التاريخ *</label>
                                        <input type="date" name="startDate" value="${escapeHtml(startDateVal)}" required onchange="updatePermitModalDurationPreview()" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-mono">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-0.5">الساعة *</label>
                                        <input type="time" name="startTime" value="${escapeHtml(startTimeVal)}" required onchange="updatePermitModalDurationPreview()" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-mono">
                                    </div>
                                </div>
                            </div>

                            <div class="bg-white p-2.5 rounded-xl border space-y-2">
                                <div class="font-bold text-blue-900">وقت الانتهاء (يُملأ عند انتهاء الشغل أو لاحقاً):</div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-0.5">تاريخ النهاية</label>
                                        <input type="date" name="endDate" value="${escapeHtml(endDateVal)}" onchange="updatePermitModalDurationPreview()" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-mono">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] text-slate-500 mb-0.5">ساعة النهاية</label>
                                        <input type="time" name="endTime" value="${escapeHtml(endTimeVal)}" onchange="updatePermitModalDurationPreview()" class="w-full px-2.5 py-1.5 bg-slate-50 border rounded-lg font-mono">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="permit-duration-live" class="bg-blue-50 border border-blue-200 text-blue-950 font-extrabold px-3.5 py-2 rounded-xl text-xs"></div>
                    </div>

                    <!-- مهمات الوقاية الشخصية PPE -->
                    <div class="bg-slate-50 p-3.5 rounded-2xl border space-y-2">
                        <div class="font-extrabold text-slate-900"><i class="fa-solid fa-shield-halved ml-1 text-emerald-600"></i>مهمات الوقاية الشخصية (PPE):</div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                            ${PPE_ITEMS.map(it => {
                                const isChecked = ed ? selectedPpe.includes(it.label) : false;
                                return `
                                    <label class="flex items-center gap-2 bg-white p-2 rounded-xl border cursor-pointer select-none">
                                        <input type="checkbox" name="ppe[]" value="${escapeHtml(it.label)}" ${isChecked ? 'checked' : ''} class="accent-emerald-600 w-4 h-4">
                                        <span class="font-semibold text-slate-800">${escapeHtml(it.label)}</span>
                                    </label>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">
                            ${ed ? 'حفظ التعديلات ✓' : 'حفظ التصريح ✓'}
                        </button>
                    </div>
                </form>
            `);

            applyPermitTypeGuidance(typeVal, !ed);
            updatePermitModalDurationPreview();

            document.getElementById('permit-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const payload = {
                    type: fd.get('type'),
                    location: fd.get('location').trim(),
                    executor: (fd.get('executor') || '').trim(),
                    notes: (fd.get('notes') || '').trim(),
                    startDate: fd.get('startDate'),
                    startTime: fd.get('startTime'),
                    endDate: fd.get('endDate') || '',
                    endTime: fd.get('endTime') || '',
                    ppe: fd.getAll('ppe[]')
                };

                if (ed) {
                    Object.assign(ed, payload);
                    showToast(`تم تعديل التصريح (${ed.id}) وحساب المدة تلقائياً ✓`, 'success');
                } else {
                    const nextNum = permitState.permits.length + 1;
                    permitState.permits.unshift({
                        id: `PTW-${String(nextNum).padStart(3, '0')}`,
                        ...payload
                    });
                    showToast('تم حفظ تصريح العمل بنجاح ✓', 'success');
                }

                savePermitsState();
                closeModal();
                renderPermits();
            });
        }

        // ==================== نافذة سريعة لتسجيل وقت انتهاء الشغل عند عودة المستخدم ====================
        function openFinishPermitTimeModal(permitId) {
            const p = permitState.permits.find(x => x.id === permitId);
            if (!p) return;
            const now = new Date();
            const defaultEndDate = p.endDate || now.toISOString().split('T')[0];
            const defaultEndTime = p.endTime || now.toTimeString().slice(0, 5);

            openModal(`تسجيل وقت انتهاء الشغل (${p.id})`, `
                <form id="finish-permit-form" class="space-y-4 text-xs" dir="rtl">
                    <div class="bg-slate-50 p-3 rounded-2xl border space-y-1">
                        <div><strong>نوع التصريح:</strong> ${escapeHtml(p.type)} — <strong>الموقع:</strong> ${escapeHtml(p.location)}</div>
                        <div class="font-mono text-slate-600"><strong>وقت البداية:</strong> ${escapeHtml(p.startDate)} ${escapeHtml(p.startTime)}</div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block font-bold mb-1">تاريخ الانتهاء *</label>
                            <input type="date" id="finish-end-date" name="endDate" value="${escapeHtml(defaultEndDate)}" required onchange="updateFinishPreview('${escapeHtml(p.startDate)}', '${escapeHtml(p.startTime)}')" class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-mono">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">ساعة الانتهاء *</label>
                            <input type="time" id="finish-end-time" name="endTime" value="${escapeHtml(defaultEndTime)}" required onchange="updateFinishPreview('${escapeHtml(p.startDate)}', '${escapeHtml(p.startTime)}')" class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-mono">
                        </div>
                    </div>

                    <div id="finish-duration-preview" class="bg-emerald-50 border border-emerald-200 text-emerald-950 font-extrabold px-3.5 py-2.5 rounded-xl"></div>

                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">حفظ وقت النهاية ✓</button>
                    </div>
                </form>
            `);

            updateFinishPreview(p.startDate, p.startTime);

            document.getElementById('finish-permit-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                p.endDate = fd.get('endDate');
                p.endTime = fd.get('endTime');
                savePermitsState();
                closeModal();
                renderPermits();
                showToast('تم تسجيل وقت النهاية وحساب مدة الشغل تلقائياً ✓', 'success');
            });
        }

        function updateFinishPreview(sDate, sTime) {
            const eDate = document.getElementById('finish-end-date')?.value || '';
            const eTime = document.getElementById('finish-end-time')?.value || '';
            const el = document.getElementById('finish-duration-preview');
            if (el) el.textContent = calculateDurationSummary(sDate, sTime, eDate, eTime);
        }

        function deletePermit(permitId) {
            openConfirmModal('حذف تصريح عمل', 'هل تريد حذف هذا التصريح نهائياً؟', () => {
                permitState.permits = permitState.permits.filter(x => x.id !== permitId);
                savePermitsState();
                renderPermits();
                showToast('تم حذف التصريح', 'info');
            });
        }

        // ==================== النوافذ المساعدة ====================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            const m = document.getElementById('modal-container');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('modal-container');
            m.classList.add('hidden'); m.classList.remove('flex');
        }
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = msg;
            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderPermits);
    </script>

<script>
(function () {
  if (window.__OHS_AI_BRIDGE_READY__) return;
  window.__OHS_AI_BRIDGE_READY__ = true;

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {
    let base = 'https://ohs-management.ahmed4qhse.workers.dev';
    let token = '';
    try {
      const raw = localStorage.getItem('hse_session_v2') || localStorage.getItem('hse_session_v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.apiBase) base = s.apiBase;
        if (s.token) token = s.token;
      }
    } catch {}

    const res = await fetch(base + '/api/ai', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({
        question: String(question || '').trim(),
        mode: options.mode || 'deep_analysis',
        images: Array.isArray(options.images) ? options.images : []
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
  };
})();
</script>

</body>
