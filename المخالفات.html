<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التفتيش والمخالفات والملاحظات الوقائية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Cairo', 'sans-serif'] },
                        colors: {
                            emerald: { 50:'#eff8ff',100:'#dbeefe',200:'#bfe0fc',300:'#8fc7f8',400:'#5aa8ef',500:'#3a8be0',600:'#2468c4',700:'#1b4fa0',800:'#173f80',900:'#12306b',950:'#0b2150' },
                            slate: { 50:'#f4f8fd',100:'#e8f0fa',200:'#d3e0f0',300:'#b3c6de',400:'#8499b8',500:'#5f7497',600:'#475b7e',700:'#2f4468',800:'#16295a',900:'#0d2154',950:'#071538' }
                        }
                    }
                }
            };
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(180deg,#f3f9ff 0%,#e6f1fc 100%) fixed; color: #0d2154; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #dbeafe; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        .card-shadow { box-shadow: 0 4px 18px rgba(36,104,196,.08); }
        .pdf-paper-a4 { width: 210mm; min-height: 297mm; max-width: 100%; }
        @media print {
            body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #toast-container, #app-header, #main-content, #modal-container, #confirm-modal, #pdf-studio-modal { display: none !important; }
            #print-area { display: block !important; position: static !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .print-break-avoid, #print-area tr { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
    <style>@page { size: A4 portrait; margin: 8mm; }</style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
    <div id="print-area" class="hidden bg-white p-4 text-slate-900"></div>

    <!-- الشريط العلوي لوحدة التفتيش والمخالفات والملاحظات الوقائية -->
    <header id="app-header" class="bg-slate-900 text-white sticky top-0 z-20 px-4 sm:px-6 py-3.5 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-300 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold">التفتيش والمخالفات والملاحظات الوقائية</h1>
                    <p class="text-[11px] text-slate-300">رصد التكرار لنفس الفرد أو القسم • ملاحظات وقائية • تقرير PDF لليوم وإرسال للموارد البشرية (HR)</p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button type="button" onclick="openDailyViolationsPdfModal('pdf')" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-file-pdf ml-1"></i>تحميل مخالفات اليوم PDF
                </button>
                <button type="button" onclick="openPreventiveNoteModal()" class="px-3.5 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-seedling ml-1"></i>ملاحظة وقائية
                </button>
                <button type="button" onclick="openViolationModal()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-plus ml-1"></i>تسجيل مخالفة جديدة
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="main-content" class="max-w-6xl mx-auto p-4 sm:p-6"></main>

    <!-- النافذة المنبثقة -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden my-auto">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900">عنوان</h3>
                <button type="button" onclick="closeModal()" class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-red-600 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 id="confirm-title" class="text-lg font-extrabold text-slate-900 mb-2">تأكيد</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeConfirmModal(false)" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">إلغاء</button>
                <button type="button" onclick="closeConfirmModal(true)" class="px-5 py-2 rounded-xl bg-red-600 text-white font-bold text-sm">تأكيد</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_VIOLATIONS = 'ohs_module_violations_clean_v4';

        function loadViolationsState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_VIOLATIONS)
                    || localStorage.getItem('ohs_module_violations_clean_v3')
                    || localStorage.getItem('ohs_module_violations_clean_v2');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        violations: Array.isArray(parsed.violations) ? parsed.violations : [],
                        preventiveNotes: Array.isArray(parsed.preventiveNotes) ? parsed.preventiveNotes : []
                    };
                }
            } catch (e) {}
            return { violations: [], preventiveNotes: [] };
        }

        let violationState = loadViolationsState();
        let confirmCallback = null;
        let selectedViolationTarget = 'individual'; // 'individual' | 'department'
        let selectedImmediateStatus = 'done'; // 'done' | 'not_done'
        let activeTabView = 'all'; // 'all' | 'violations' | 'preventive'

        let dayExportConfig = {
            selectedDate: new Date().toISOString().split('T')[0],
            includeCompanyName: false,
            companyName: '',
            includeLogo: false,
            logoDataUrl: ''
        };

        function saveViolationsState() {
            try {
                localStorage.setItem(STORAGE_KEY_VIOLATIONS, JSON.stringify(violationState));
            } catch (e) {
                showToast('تعذر الحفظ المحلي بالمتصفح', 'error');
            }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function normalizeTextKey(s) {
            return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function formatOrdinalArabic(n) {
            if (n === 1) return 'أول مرة';
            if (n === 2) return 'ثاني مرة';
            if (n === 3) return 'ثالث مرة';
            if (n === 4) return 'رابع مرة';
            if (n === 5) return 'خامس مرة';
            return `المرة رقم ${n}`;
        }

        // ==================== حساب عدد مرات التكرار لنفس الفرد أو نفس القسم ====================
        function computeRepeatCountForEntry(candidate, excludeId = null) {
            const isInd = (candidate.targetType === 'individual');
            const descKey = normalizeTextKey(candidate.description);
            const deptKey = normalizeTextKey(candidate.department);
            const personKey = normalizeTextKey(candidate.personName);

            if (!descKey) return 1;

            const priorMatches = violationState.violations.filter(item => {
                if (excludeId && item.id === excludeId) return false;
                if ((item.targetType || 'individual') !== candidate.targetType) return false;
                if (normalizeTextKey(item.description) !== descKey) return false;

                if (isInd) {
                    return personKey && normalizeTextKey(item.personName) === personKey
                        && (!deptKey || normalizeTextKey(item.department) === deptKey);
                } else {
                    return deptKey && normalizeTextKey(item.department) === deptKey;
                }
            });

            return priorMatches.length + 1;
        }

        function buildRepeatBadgeLabel(occurrenceNum, targetType) {
            if (occurrenceNum <= 1) {
                return {
                    isRepeat: false,
                    text: 'أول مرة (غير مكررة)',
                    badgeClass: 'bg-slate-100 text-slate-700 border border-slate-200'
                };
            }
            const repeatTimes = occurrenceNum - 1;
            const targetText = (targetType === 'individual') ? 'لنفس الفرد' : 'لنفس القسم';
            return {
                isRepeat: true,
                text: `متكررة ${repeatTimes === 1 ? 'مرة واحدة' : repeatTimes === 2 ? 'مرتين' : `${repeatTimes} مرات`} (${formatOrdinalArabic(occurrenceNum)} ${targetText})`,
                badgeClass: 'bg-amber-100 text-amber-950 border border-amber-300'
            };
        }

        // ==================== عرض الشاشة الرئيسية (المخالفات + الملاحظات الوقائية) ====================
        function renderViolations() {
            const vList = violationState.violations;
            const pList = violationState.preventiveNotes;
            const today = new Date().toISOString().split('T')[0];
            const todayViolationsCount = vList.filter(v => v.date === today).length;
            const indCount = vList.filter(v => v.targetType === 'individual').length;
            const deptCount = vList.filter(v => v.targetType === 'department').length;

            const showViolations = (activeTabView === 'all' || activeTabView === 'violations');
            const showPreventive = (activeTabView === 'all' || activeTabView === 'preventive');

            document.getElementById('main-content').innerHTML = `
                <!-- شريط الملخص والتبديل -->
                <div class="bg-white rounded-2xl p-4 border card-shadow mb-4 flex flex-wrap justify-between items-center gap-3">
                    <div class="flex flex-wrap items-center gap-2 text-xs">
                        <button type="button" onclick="activeTabView='all'; renderViolations();" class="px-3 py-1.5 rounded-xl font-extrabold transition ${activeTabView === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                            الكل (${vList.length + pList.length})
                        </button>
                        <button type="button" onclick="activeTabView='violations'; renderViolations();" class="px-3 py-1.5 rounded-xl font-extrabold transition ${activeTabView === 'violations' ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-900 hover:bg-blue-100'}">
                            المخالفات (${vList.length})
                        </button>
                        <button type="button" onclick="activeTabView='preventive'; renderViolations();" class="px-3 py-1.5 rounded-xl font-extrabold transition ${activeTabView === 'preventive' ? 'bg-teal-600 text-white' : 'bg-teal-50 text-teal-900 hover:bg-teal-100'}">
                            ملاحظات وقائية (${pList.length})
                        </button>
                        <span class="px-2.5 py-1 rounded-full bg-red-50 text-red-800 border border-red-200 font-bold">مخالفات اليوم: ${todayViolationsCount}</span>
                        <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-bold">فرد: ${indCount} • قسم: ${deptCount}</span>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="openDailyViolationsPdfModal('pdf')" class="bg-red-600 hover:bg-red-700 text-white font-extrabold px-3.5 py-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-file-pdf ml-1"></i>مخالفات اليوم PDF (HR)
                        </button>
                        <button type="button" onclick="openPreventiveNoteModal()" class="bg-teal-600 hover:bg-teal-700 text-white font-extrabold px-3.5 py-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-seedling ml-1"></i>ملاحظة وقائية
                        </button>
                        <button type="button" onclick="openViolationModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-plus ml-1"></i>تسجيل مخالفة جديدة
                        </button>
                    </div>
                </div>

                ${showViolations ? `
                    <div class="space-y-3 mb-6">
                        ${vList.map(v => {
                            const isIndividual = (v.targetType === 'individual');
                            const isImmediateDone = (v.immediateStatus !== 'not_done');
                            const occ = computeRepeatCountForEntry(v, v.id);
                            const rep = buildRepeatBadgeLabel(occ, v.targetType || 'individual');

                            return `
                                <div class="bg-white rounded-2xl p-4 sm:p-5 border card-shadow text-xs space-y-3">
                                    <div class="flex flex-wrap justify-between items-center gap-2">
                                        <div class="flex flex-wrap items-center gap-2">
                                            <span class="font-mono font-extrabold bg-slate-900 text-white px-2.5 py-1 rounded">${escapeHtml(v.id)}</span>
                                            <span class="px-2.5 py-1 rounded-full font-extrabold ${isIndividual ? 'bg-blue-100 text-blue-900 border border-blue-200' : 'bg-indigo-100 text-indigo-900 border border-indigo-200'}">
                                                ${isIndividual ? 'مخالفة فرد' : 'مخالفة قسم'}
                                            </span>
                                            <span class="px-2.5 py-1 rounded-full font-extrabold ${rep.badgeClass}">
                                                <i class="fa-solid fa-repeat ml-1"></i>${escapeHtml(rep.text)}
                                            </span>
                                            ${isIndividual ? `
                                                <span class="px-2.5 py-1 rounded-full font-extrabold ${isImmediateDone ? 'bg-emerald-100 text-emerald-900 border border-emerald-200' : 'bg-red-100 text-red-800 border border-red-200'}">
                                                    ${isImmediateDone ? 'تصحيح فوري تم' : 'لم يتم تصحيح فوري'}
                                                </span>
                                            ` : `
                                                <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-200 font-extrabold">
                                                    ${escapeHtml(v.status || 'مغلقة')}
                                                </span>
                                            `}
                                        </div>
                                        <div class="font-bold text-slate-600">
                                            ${isIndividual
                                                ? `الشخص المخالف: <strong class="text-slate-900">${escapeHtml(v.personName || '-')}</strong> • القسم: <strong class="text-slate-900">${escapeHtml(v.department || '-')}</strong>`
                                                : `القسم المخالف: <strong class="text-slate-900">${escapeHtml(v.department || '-')}</strong>`
                                            }
                                            ${v.date ? ` • التاريخ: <span class="font-mono">${escapeHtml(v.date)}</span>` : ''}
                                        </div>
                                    </div>

                                    <div class="font-bold text-sm text-slate-900 leading-relaxed">
                                        ${escapeHtml(v.description)}
                                    </div>

                                    ${isIndividual ? `
                                        ${isImmediateDone ? `
                                            <div class="bg-emerald-50/70 rounded-xl p-3 border border-emerald-200 text-emerald-950 font-bold">
                                                <i class="fa-solid fa-circle-check text-emerald-600 ml-1"></i>
                                                تصحيح فوري تم${v.immediateCorrectionNote ? ` — ${escapeHtml(v.immediateCorrectionNote)}` : ''}.
                                            </div>
                                        ` : `
                                            <div class="bg-red-50/80 rounded-xl p-3 border border-red-200 text-red-950 font-bold space-y-1">
                                                <div><i class="fa-solid fa-triangle-exclamation text-red-600 ml-1"></i>لم يتم تصحيح فوري — مطلوب اتخاذ الإجراءات اللازمة مع الشخص المخالف.</div>
                                                ${v.immediateCorrectionNote ? `<div class="text-[11px] text-red-900 font-semibold">ملاحظات: ${escapeHtml(v.immediateCorrectionNote)}</div>` : ''}
                                            </div>
                                        `}
                                    ` : `
                                        <div class="bg-slate-50 rounded-xl p-3 border space-y-2">
                                            <div class="text-slate-800">
                                                <strong class="text-blue-900">السبب الجذري:</strong>
                                                <span class="font-semibold">${escapeHtml(v.rootCause || '-')}</span>
                                            </div>
                                            <div class="text-slate-800 pt-1.5 border-t">
                                                <strong class="text-emerald-900">الإجراء التصحيحي:</strong>
                                                <span class="font-semibold">${escapeHtml(v.correctiveAction || '-')}</span>
                                            </div>
                                        </div>
                                    `}

                                    <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t">
                                        <button type="button" onclick="deleteViolation('${escapeHtml(v.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold transition">
                                            <i class="fa-solid fa-trash-can ml-1"></i>حذف المخالفة
                                        </button>
                                        <button type="button" onclick="openViolationModal('${escapeHtml(v.id)}')" class="px-3.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-500 text-amber-900 hover:text-white border border-amber-200 font-bold transition">
                                            <i class="fa-solid fa-pen-to-square ml-1"></i>تعديل المخالفة
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('') || (activeTabView === 'violations' ? `
                            <div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs border card-shadow">
                                لا توجد مخالفات مسجلة بعد.
                            </div>
                        ` : '')}
                    </div>
                ` : ''}

                ${showPreventive ? `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <h2 class="text-sm font-extrabold text-teal-950"><i class="fa-solid fa-seedling ml-1 text-teal-600"></i>الملاحظات الوقائية (${pList.length})</h2>
                            <span class="text-[11px] text-slate-500">تنبيهات استباقية لتحسين الأمان قبل وقوع مخالفة أو حادث</span>
                        </div>
                        ${pList.map(pn => `
                            <div class="bg-white rounded-2xl p-4 sm:p-5 border-2 border-teal-200/80 card-shadow text-xs space-y-2.5">
                                <div class="flex flex-wrap justify-between items-center gap-2">
                                    <div class="flex items-center gap-2">
                                        <span class="font-mono font-extrabold bg-teal-900 text-white px-2.5 py-1 rounded">${escapeHtml(pn.id)}</span>
                                        <span class="px-2.5 py-1 rounded-full bg-teal-100 text-teal-900 font-extrabold">ملاحظة وقائية</span>
                                        ${pn.area ? `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-800 font-bold">الموقع / القسم: ${escapeHtml(pn.area)}</span>` : ''}
                                    </div>
                                    <span class="font-mono font-bold text-slate-500">${escapeHtml(pn.date || '')}</span>
                                </div>
                                <div class="font-bold text-sm text-slate-900 leading-relaxed">${escapeHtml(pn.observation)}</div>
                                ${pn.suggestion ? `
                                    <div class="bg-teal-50/70 rounded-xl p-2.5 border border-teal-200 text-teal-950">
                                        <strong>توصية استباقية:</strong> ${escapeHtml(pn.suggestion)}
                                    </div>
                                ` : ''}
                                <div class="flex justify-between items-center pt-2 border-t">
                                    <button type="button" onclick="deletePreventiveNote('${escapeHtml(pn.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold transition">
                                        <i class="fa-solid fa-trash-can ml-1"></i>حذف
                                    </button>
                                    <button type="button" onclick="openPreventiveNoteModal('${escapeHtml(pn.id)}')" class="px-3.5 py-1.5 rounded-lg bg-teal-50 hover:bg-teal-600 text-teal-900 hover:text-white border border-teal-200 font-bold transition">
                                        <i class="fa-solid fa-pen-to-square ml-1"></i>تعديل
                                    </button>
                                </div>
                            </div>
                        `).join('') || `
                            <div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs border card-shadow">
                                لا توجد ملاحظات وقائية مسجلة بعد — اضغط على <strong>"+ ملاحظة وقائية"</strong> لتسجيل تنبيه استباقي.
                            </div>
                        `}
                    </div>
                ` : ''}
            `;
        }

        // ==================== الملاحظات الوقائية مع تلميح شرح مبسط ====================
        function openPreventiveNoteModal(noteId = null) {
            const ed = noteId ? violationState.preventiveNotes.find(x => x.id === noteId) : null;
            const today = new Date().toISOString().split('T')[0];

            openModal(ed ? `تعديل ملاحظة وقائية (${ed.id})` : 'إضافة ملاحظة وقائية جديدة', `
                <form id="pn-form" class="space-y-4 text-xs" dir="rtl">
                    <div class="bg-teal-50 border border-teal-200 rounded-2xl p-3.5 text-teal-950 leading-relaxed space-y-1">
                        <div class="font-extrabold text-sm"><i class="fa-solid fa-circle-info text-teal-600 ml-1"></i>ما هي الملاحظات الوقائية؟</div>

        // ==================== تجميع مخالفات اليوم في ملف PDF منسق لإدارة HR ====================
        function compressLogoImage(file, maxW = 450, quality = 0.88) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxW / (img.width || maxW));
                        const w = Math.max(1, Math.round((img.width || maxW) * scale));
                        const h = Math.max(1, Math.round((img.height || maxW) * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const outType = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
                        resolve(canvas.toDataURL(outType, quality));
                    };
                    img.onerror = () => resolve(String(reader.result || ''));
                    img.src = String(reader.result || '');
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        function drawRoundedRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth = 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
            if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth; ctx.stroke(); }
            ctx.restore();
        }

        function loadImageSafe(src) {
            return new Promise((resolve) => {
                if (!src) { resolve(null); return; }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function renderDayViolationsPdfPages() {
            const targetDate = dayExportConfig.selectedDate || new Date().toISOString().split('T')[0];
            const items = violationState.violations.filter(v => v.date === targetDate);
            const showComp = dayExportConfig.includeCompanyName && dayExportConfig.companyName;
            const showLogo = dayExportConfig.includeLogo && dayExportConfig.logoDataUrl;
            const logoImg = showLogo ? await loadImageSafe(dayExportConfig.logoDataUrl) : null;

            const W = 1240;
            const H = 1754;
            const M = 52;
            const contentW = W - M * 2;
            const pages = [];

            const createPage = (pageNum) => {
                const canvas = document.createElement('canvas');
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);
                drawRoundedRect(ctx, 26, 26, W - 52, H - 52, 16, '#ffffff', '#cbd5e1', 2);

                const grad = ctx.createLinearGradient(26, 26, W - 26, 185);
                grad.addColorStop(0, '#071538');
                grad.addColorStop(0.6, '#12306b');
                grad.addColorStop(1, '#1b4fa0');
                drawRoundedRect(ctx, 26, 26, W - 52, 160, 14, grad, null);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#93c5fd';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('DAILY OHS VIOLATIONS REPORT — FOR HUMAN RESOURCES (HR)', W - 58, 64);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('تقرير المخالفات اليومية للسلامة والصحة المهنية', W - 58, 108);

                if (showComp) {
                    ctx.fillStyle = '#fde68a';
                    ctx.font = 'bold 21px sans-serif';
                    ctx.fillText(String(dayExportConfig.companyName), W - 58, 148);
                }

                if (logoImg) {
                    drawRoundedRect(ctx, 52, 48, 200, 114, 12, '#ffffff', '#e2e8f0', 2);
                    const scale = Math.min(176 / logoImg.width, 94 / logoImg.height);
                    const lw = logoImg.width * scale;
                    const lh = logoImg.height * scale;
                    ctx.drawImage(logoImg, 52 + (200 - lw) / 2, 48 + (114 - lh) / 2, lw, lh);
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(`إدارة السلامة والصحة المهنية  •  صفحة ${pageNum}`, W / 2, H - 42);

                pages.push(canvas);
                return { canvas, ctx, y: 206 };
            };

            let { ctx, y } = createPage(1);

            const indCount = items.filter(v => v.targetType === 'individual').length;
            const deptCount = items.filter(v => v.targetType === 'department').length;
            const notDoneCount = items.filter(v => v.targetType === 'individual' && v.immediateStatus === 'not_done').length;

            drawRoundedRect(ctx, M, y, contentW, 56, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`التاريخ: ${targetDate}`, W - M - 20, y + 35);
            ctx.fillText(`إجمالي اليوم: ${items.length} (أفراد: ${indCount} | أقسام: ${deptCount})`, 760, y + 35);
            ctx.fillStyle = '#b91c1c';
            ctx.fillText(`أفراد بدون تصحيح فوري: ${notDoneCount}`, 280, y + 35);
            y += 76;

            const drawHeader = () => {
                drawRoundedRect(ctx, M, y, contentW, 44, 6, '#0d2154', null);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('م', W - M - 22, y + 28);
                ctx.textAlign = 'right';
                ctx.fillText('المخالف (فرد / قسم)', W - M - 52, y + 28);
                ctx.fillText('وصف المخالفة', W - M - 310, y + 28);
                ctx.fillText('الموقف / التصحيح / السبب الجذري', 540, y + 28);
                ctx.textAlign = 'center';
                ctx.fillText('التكرار', 135, y + 28);
                y += 44;
            };

            drawHeader();

            const wrapLines = (context, text, maxW) => {
                const words = String(text || '').split(/\s+/);
                const lines = [];
                let cur = '';
                for (const w of words) {
                    const test = cur ? `${cur} ${w}` : w;
                    if (context.measureText(test).width > maxW && cur) {
                        lines.push(cur);
                        cur = w;
                    } else {
                        cur = test;
                    }
                }
                if (cur) lines.push(cur);
                return lines.length ? lines : ['-'];
            };

            items.forEach((v, idx) => {
                const isInd = (v.targetType === 'individual');
                const isDone = (v.immediateStatus !== 'not_done');
                const occ = computeRepeatCountForEntry(v, v.id);
                const rep = buildRepeatBadgeLabel(occ, v.targetType || 'individual');

                const whoStr = isInd
                    ? `فرد: ${v.personName || '-'} (${v.department || '-'})`
                    : `قسم: ${v.department || '-'}`;

                const actionStr = isInd
                    ? (isDone
                        ? `تصحيح فوري تم${v.immediateCorrectionNote ? ` — ${v.immediateCorrectionNote}` : ''}`
                        : `لم يتم تصحيح فوري${v.immediateCorrectionNote ? ` — ${v.immediateCorrectionNote}` : ''}`)
                    : `السبب الجذري: ${v.rootCause || '-'} | الإجراء التصحيحي: ${v.correctiveAction || '-'}`;

                ctx.font = 'bold 15px sans-serif';
                const whoLines = wrapLines(ctx, whoStr, 240);
                const descLines = wrapLines(ctx, v.description, 270);
                const actLines = wrapLines(ctx, actionStr, 310);
                const maxL = Math.max(whoLines.length, descLines.length, actLines.length);
                const rowH = Math.max(52, maxL * 23 + 18);

                if (y + rowH > H - 165) {
                    const next = createPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                    drawHeader();
                }

                ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                ctx.fillRect(M, y, contentW, rowH);
                ctx.strokeStyle = '#cbd5e1';
                ctx.strokeRect(M, y, contentW, rowH);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#0f172a';
                ctx.fillText(String(idx + 1), W - M - 22, y + 29);

                ctx.textAlign = 'right';
                whoLines.forEach((ln, li) => ctx.fillText(ln, W - M - 52, y + 29 + li * 22));
                descLines.forEach((ln, li) => ctx.fillText(ln, W - M - 310, y + 29 + li * 22));

                ctx.fillStyle = (isInd && !isDone) ? '#991b1b' : '#0f172a';
                actLines.forEach((ln, li) => ctx.fillText(ln, 540, y + 29 + li * 22));

                ctx.textAlign = 'center';
                ctx.fillStyle = rep.isRepeat ? '#92400e' : '#334155';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(occ > 1 ? `متكررة (${occ - 1})` : 'أول مرة', 135, y + 32);

                y += rowH;
            });

            if (y > H - 175) {
                const next = createPage(pages.length + 1);
                ctx = next.ctx;
                y = next.y;
            }
            const sigY = Math.max(y + 16, H - 175);
            const sigW = (contentW - 24) / 2;

            drawRoundedRect(ctx, W - M - sigW, sigY, sigW, 96, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('إعداد قسم السلامة والصحة المهنية', W - M - sigW / 2, sigY + 32);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('الاسم: ......................   |   التوقيع: ......................', W - M - sigW / 2, sigY + 74);

            drawRoundedRect(ctx, M, sigY, sigW, 96, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('استلام وإجراء إدارة الموارد البشرية (HR)', M + sigW / 2, sigY + 32);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('الاسم: ......................   |   التوقيع: ......................', M + sigW / 2, sigY + 74);

            return pages;
        }

        async function downloadCurrentDayPdf() {
            const targetDate = dayExportConfig.selectedDate || new Date().toISOString().split('T')[0];
            const items = violationState.violations.filter(v => v.date === targetDate);
            if (!items.length) {
                showToast(`لا توجد مخالفات مسجلة بتاريخ (${targetDate})`, 'error');
                return;
            }

            const JsPdfCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
            if (!JsPdfCtor) {
                openDayViolationsPrintStudio();
                printCurrentStudioReport();
                return;
            }

            showToast('جاري تجهيز ملف PDF لمخالفات اليوم...', 'info');
            try {
                const pages = await renderDayViolationsPdfPages();
                const pdf = new JsPdfCtor({ unit: 'mm', format: 'a4', orientation: 'portrait' });
                pages.forEach((canvas, idx) => {
                    if (idx > 0) pdf.addPage('a4', 'portrait');
                    const imgData = canvas.toDataURL('image/jpeg', 0.94);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                });
                const safeDate = String(targetDate).replace(/[^0-9-]/g, '');
                pdf.save(`OHS_Daily_Violations_HR_${safeDate}.pdf`);
                showToast('تم تحميل ملف PDF لمخالفات اليوم بنجاح ✓', 'success');
            } catch (e) {
                openDayViolationsPrintStudio();
                printCurrentStudioReport();
            }
        }

        function openModal(title, html) {

        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;

            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');

        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderViolations);
    </script>

(function () {
  if (window.__OHS_AI_BRIDGE_READY__) return;
  window.__OHS_AI_BRIDGE_READY__ = true;

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {
    let base = 'https://ohs-management.ahmed4qhse.workers.dev';
    let token = '';
    try {
      const raw = localStorage.getItem('hse_session_v2') || localStorage.getItem('hse_session_v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.apiBase) base = s.apiBase;
        if (s.token) token = s.token;
      }
    } catch {}

    const res = await fetch(base + '/api/ai', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({
        question: String(question || '').trim(),
        mode: options.mode || 'deep_analysis',
        images: Array.isArray(options.images) ? options.images : []
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
