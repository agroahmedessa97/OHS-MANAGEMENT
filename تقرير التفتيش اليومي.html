<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير التفتيش اليومي للسلامة والصحة المهنية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Cairo', 'sans-serif'] },
                        colors: {
                            emerald: { 50:'#eff8ff',100:'#dbeefe',200:'#bfe0fc',300:'#8fc7f8',400:'#5aa8ef',500:'#3a8be0',600:'#2468c4',700:'#1b4fa0',800:'#173f80',900:'#12306b',950:'#0b2150' },
                            slate: { 50:'#f4f8fd',100:'#e8f0fa',200:'#d3e0f0',300:'#b3c6de',400:'#8499b8',500:'#5f7497',600:'#475b7e',700:'#2f4468',800:'#16295a',900:'#0d2154',950:'#071538' }
                        }
                    }
                }
            };
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(180deg,#f3f9ff 0%,#e6f1fc 100%) fixed; color: #0d2154; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #dbeafe; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        .card-shadow { box-shadow: 0 4px 18px rgba(36,104,196,.08); }
        .pdf-paper-a4 { width: 210mm; min-height: 297mm; max-width: 100%; }
        @media print {
            body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #toast-container, #app-header, #main-content, #modal-container, #confirm-modal, #pdf-studio-modal { display: none !important; }
            #print-area { display: block !important; position: static !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .print-break-avoid, #print-area tr { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
    <style>@page { size: A4 portrait; margin: 8mm; }</style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
    <div id="print-area" class="hidden bg-white p-4 text-slate-900"></div>

    <!-- الشريط العلوي المباشر للوحدة -->
    <header id="app-header" class="bg-slate-900 text-white sticky top-0 z-20 px-4 sm:px-6 py-3.5 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600/25 border border-emerald-400/40 text-emerald-300 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold">تقرير التفتيش اليومي للسلامة والصحة المهنية</h1>
                    <p class="text-[11px] text-slate-300">اختيار البنود الفعلية فقط • لوجو الشركة • معاينة وطباعة وتحميل PDF احترافي</p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button type="button" onclick="openChecklistManagerModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-xs transition">
                    <i class="fa-solid fa-list-check ml-1 text-emerald-400"></i>إدارة بنود التفتيش
                </button>
                <button type="button" onclick="openDailyReportModal()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-plus ml-1"></i>عمل تقرير تفتيش يومي
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="main-content" class="max-w-5xl mx-auto p-4 sm:p-6"></main>

    <!-- النافذة المنبثقة الرئيسية -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden my-auto">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900">عنوان</h3>
                <button type="button" onclick="closeModal()" class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-red-600 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- استوديو معاينة وطباعة وتحميل التقرير بصيغة PDF -->
    <div id="pdf-studio-modal" class="fixed inset-0 z-50 hidden flex-col bg-slate-900/90">
        <div class="bg-slate-950 text-white px-4 sm:px-6 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-red-500/20 text-red-400 flex items-center justify-center"><i class="fa-solid fa-file-pdf text-lg"></i></div>
                <div>
                    <h3 id="studio-modal-title" class="text-sm font-extrabold">معاينة التقرير الرسمي — طباعة وتحميل PDF</h3>
                    <p class="text-[11px] text-slate-400">يمكنك رفع أو تغيير لوجو الشركة قبل الطباعة أو تحميل ملف PDF</p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <input type="file" id="studio-logo-input" accept="image/*" class="hidden" onchange="handleStudioLogoUpload(this)">
                <button type="button" onclick="document.getElementById('studio-logo-input').click()" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold transition">
                    <i class="fa-solid fa-image ml-1"></i>رفع / تغيير لوجو الشركة
                </button>
                <button type="button" id="studio-remove-logo-btn" onclick="removeStudioLogo()" class="hidden px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition">
                    إزالة اللوجو
                </button>
                <button type="button" onclick="downloadReportPdfFile()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow transition">
                    <i class="fa-solid fa-file-pdf ml-1"></i>تحميل التقرير بصيغة PDF
                </button>
                <button type="button" onclick="printCurrentStudioReport()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold transition">
                    <i class="fa-solid fa-print ml-1"></i>طباعة التقرير
                </button>
                <button type="button" onclick="closePdfStudio()" class="w-9 h-9 rounded-xl bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-auto bg-slate-300/90 p-4 sm:p-8 flex justify-center items-start">
            <div id="pdf-paper-canvas" dir="rtl" class="pdf-paper-a4 bg-white text-slate-900 shadow-2xl rounded-md p-6 sm:p-8" style="font-size: 13px;"></div>
        </div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 id="confirm-title" class="text-lg font-extrabold text-slate-900 mb-2">تأكيد</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeConfirmModal(false)" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">إلغاء</button>
                <button type="button" onclick="closeConfirmModal(true)" class="px-5 py-2 rounded-xl bg-red-600 text-white font-bold text-sm">تأكيد</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_MODULE = 'ohs_module_daily_inspection_clean_v1';

        const DEFAULT_FACILITY_CHECKLIST = [
            'خلو الممرات ومخارج الطوارئ وأبواب الهروب من أي عوائق أو تشوينات',
            'التزام العاملين بمهمات الوقاية الشخصية (PPE) حسب طبيعة كل قسم',
            'سلامة اللوحات والتوصيلات والكابلات الكهربائية وعدم وجود أسلاك مكشوفة',
            'جاهزية وسهولة الوصول إلى طفايات الحريق وصناديق الإطفاء وخلوها من العوائق',
            'حالة الترتيب والنظافة العامة (Housekeeping) وتصريف المخلفات والانسكابات',
            'سلامة المعدات المتحركة (الفوركليفت / الأوناش) والتزام السائقين بمسارات الحركة',
            'التزام أعمال الصيانة والمقاولين بتصاريح العمل السارية (PTW) وعزل الطاقة (LOTO)',
            'توافر وتحديث صحائف بيانات السلامة (SDS) والتخزين الآمن للمواد الكيميائية',
            'جاهزية صندوق الإسعافات الأولية ونقطة التجمع ولوحات الإرشاد والتحذير',
            'كفاءة التهوية والإضاءة ومستويات الضوضاء في مناطق التشغيل والإنتاج'
        ];

        function loadDailyModuleState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_MODULE);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        customChecklistItems: Array.isArray(parsed.customChecklistItems) && parsed.customChecklistItems.length
                            ? parsed.customChecklistItems
                            : [...DEFAULT_FACILITY_CHECKLIST],
                        dailyReports: Array.isArray(parsed.dailyReports) ? parsed.dailyReports : []
                    };
                }
            } catch (e) {}
            return {
                customChecklistItems: [...DEFAULT_FACILITY_CHECKLIST],
                dailyReports: []
            };
        }

        let dailyState = loadDailyModuleState();
        let confirmCallback = null;
        let tempPhotos = [];
        let tempDraftLogo = '';
        let modalChecklistDraft = [];
        let selectedShiftSystem = '8h';
        let selectedShiftSlot = 'وردية نهار';
        let activeStudioReportId = null;

        function saveDailyModuleState() {
            try {
                localStorage.setItem(STORAGE_KEY_MODULE, JSON.stringify(dailyState));
            } catch (e) {
                showToast('تعذر الحفظ المحلي بالمتصفح (قد تكون الصور كبيرة الحجم)', 'error');
            }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ==================== منطق 8 ساعات / 12 ساعة والوردية ====================
        function formatShiftDisplay(shiftSystem, shiftSlot) {
            const sys = String(shiftSystem || '8h');
            const slot = String(shiftSlot || '');
            if (sys === '12h') {
                const label12 = (slot === 'وردية ليل') ? 'وردية ليل' : 'وردية نهار';
                return { systemLabel: '12 ساعة', slotLabel: label12, fullLabel: `نظام 12 ساعة — ${label12}` };
            }
            const valid8 = ['وردية نهار', 'وردية مسائية', 'وردية ليل'];
            const chosen8 = valid8.includes(slot) ? slot : 'وردية نهار';
            return { systemLabel: '8 ساعات', slotLabel: chosen8, fullLabel: `نظام 8 ساعات — ${chosen8}` };
        }

        function getActiveChecklistTemplate() {
            if (!Array.isArray(dailyState.customChecklistItems) || !dailyState.customChecklistItems.length) {
                dailyState.customChecklistItems = [...DEFAULT_FACILITY_CHECKLIST];
            }
            return dailyState.customChecklistItems;
        }

        // ==================== العرض الرئيسي للتقارير المحفوظة ====================
        function renderDailyReports() {
            const h8Count = dailyState.dailyReports.filter(d => (d.shiftSystem || '8h') === '8h').length;
            const h12Count = dailyState.dailyReports.filter(d => d.shiftSystem === '12h').length;

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl p-4 border card-shadow mb-4 flex flex-wrap justify-between items-center gap-3">
                    <div class="flex flex-wrap items-center gap-2 text-xs">
                        <span class="font-extrabold text-slate-800 text-sm">إجمالي تقارير التفتيش: ${dailyState.dailyReports.length}</span>
                        <span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-800 border border-blue-200 font-bold">نظام 8 ساعات: ${h8Count}</span>
                        <span class="px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-800 border border-indigo-200 font-bold">نظام 12 ساعة: ${h12Count}</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="openChecklistManagerModal()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-list-check ml-1 text-emerald-400"></i>إدارة بنود التفتيش
                        </button>
                        <button type="button" onclick="openDailyReportModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition">
                            <i class="fa-solid fa-plus ml-1"></i>عمل تقرير تفتيش يومي
                        </button>
                    </div>
                </div>

                <div class="space-y-4">
                    ${dailyState.dailyReports.map(dr => {
                        const info = formatShiftDisplay(dr.shiftSystem, dr.shiftSlot);
                        const inspected = Array.isArray(dr.inspectedItems) ? dr.inspectedItems : [];
                        const photos = Array.isArray(dr.photos) ? dr.photos : [];
                        const compliantCount = inspected.filter(x => x.status === 'مطابق').length;
                        const nonCompliantCount = inspected.filter(x => x.status === 'غير مطابق').length;

                        return `
                            <div class="bg-white rounded-2xl p-4 sm:p-5 border card-shadow text-xs space-y-3">
                                <div class="flex flex-wrap justify-between items-center gap-2">
                                    <div class="flex flex-wrap items-center gap-2">
                                        ${dr.companyLogo ? `<img src="${dr.companyLogo}" alt="لوجو" class="h-9 w-auto object-contain rounded border p-0.5 bg-white">` : ''}
                                        <span class="font-mono font-extrabold bg-slate-900 text-white px-2.5 py-1 rounded">${escapeHtml(dr.id)}</span>
                                        <span class="px-2.5 py-1 rounded-full font-extrabold ${(dr.shiftSystem === '12h') ? 'bg-indigo-100 text-indigo-900 border border-indigo-200' : 'bg-emerald-100 text-emerald-900 border border-emerald-200'}">
                                            <i class="fa-solid fa-clock ml-1"></i>${escapeHtml(info.fullLabel)}
                                        </span>
                                        <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-800 font-bold">التقييم: ${escapeHtml(dr.rating)}</span>
                                        ${dr.facilityName ? `<span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-800 font-bold">${escapeHtml(dr.facilityName)}</span>` : ''}
                                    </div>
                                    <span class="font-bold text-slate-500">${escapeHtml(dr.date)}${dr.preparedBy ? ` • مسؤول السلامة: ${escapeHtml(dr.preparedBy)}` : ''}</span>
                                </div>

                                <div class="bg-slate-50 rounded-xl p-3 border space-y-2">
                                    <div class="flex flex-wrap items-center justify-between gap-2">
                                        <span class="font-extrabold text-slate-900">البنود التي تم التفتيش عليها (${inspected.length}):</span>
                                        <div class="flex gap-2 text-[11px]">
                                            <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-900 font-bold">مطابق: ${compliantCount}</span>
                                            <span class="px-2 py-0.5 rounded-full bg-red-100 text-red-800 font-bold">غير مطابق: ${nonCompliantCount}</span>
                                        </div>
                                    </div>
                                    <div class="divide-y bg-white rounded-xl border">
                                        ${inspected.map((it, idx) => `
                                            <div class="p-2.5 flex flex-wrap items-start justify-between gap-2">
                                                <div class="space-y-0.5 flex-1">
                                                    <div class="font-bold text-slate-800">${idx + 1}. ${escapeHtml(it.label)}</div>
                                                    ${it.note ? `<div class="text-[11px] text-slate-600"><strong>ملاحظات:</strong> ${escapeHtml(it.note)}</div>` : ''}
                                                </div>
                                                <span class="px-2.5 py-0.5 rounded-full font-extrabold text-[11px] shrink-0 ${it.status === 'مطابق' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}">
                                                    ${escapeHtml(it.status)}
                                                </span>
                                            </div>
                                        `).join('') || '<div class="p-3 text-slate-400 text-center">لم يتم تحديد بنود تفتيش.</div>'}
                                    </div>
                                </div>

                                ${dr.activitiesSummary ? `
                                    <div class="bg-blue-50/70 rounded-xl p-2.5 border border-blue-200 text-slate-800 leading-relaxed">
                                        <strong>ملاحظات عامة إضافية:</strong> ${escapeHtml(dr.activitiesSummary)}
                                    </div>
                                ` : ''}

                                ${dr.handoverNotes ? `
                                    <div class="bg-amber-50/70 rounded-xl p-2.5 border border-amber-200 text-[11px] text-amber-950">
                                        <strong>تسليم الوردية / متابعة:</strong> ${escapeHtml(dr.handoverNotes)}
                                    </div>
                                ` : ''}

                                ${photos.length ? `
                                    <div class="flex flex-wrap gap-2 pt-1">
                                        ${photos.map(src => `<img src="${src}" alt="صورة جولة" class="w-20 h-20 object-cover rounded-xl border">`).join('')}
                                    </div>
                                ` : ''}

                                <div class="flex flex-wrap justify-between items-center gap-2 pt-2 border-t">
                                    <div class="flex flex-wrap gap-2">
                                        <button type="button" onclick="openEditDailyReportModal('${escapeHtml(dr.id)}')" class="px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-500 text-amber-900 hover:text-white border border-amber-200 font-bold transition">
                                            <i class="fa-solid fa-pen-to-square ml-1"></i>تعديل التقرير
                                        </button>
                                        <button type="button" onclick="deleteDailyReport('${escapeHtml(dr.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold transition">
                                            <i class="fa-solid fa-trash-can ml-1"></i>حذف التقرير
                                        </button>
                                    </div>
                                    <div class="flex flex-wrap gap-2">
                                        <button type="button" onclick="openReportPdfStudio('${escapeHtml(dr.id)}')" class="px-3.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-bold transition">
                                            <i class="fa-solid fa-eye ml-1 text-amber-400"></i>معاينة وطباعة / إضافة اللوجو
                                        </button>
                                        <button type="button" onclick="downloadReportPdfFile('${escapeHtml(dr.id)}')" class="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-sm transition">
                                            <i class="fa-solid fa-file-pdf ml-1"></i>تحميل التقرير بصيغة PDF
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('') || `
                        <div class="bg-white rounded-2xl p-10 text-center text-slate-500 text-xs border card-shadow space-y-3">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mx-auto">
                                <i class="fa-solid fa-clipboard-check"></i>
                            </div>
                            <div class="font-extrabold text-sm text-slate-800">نموذج تقرير التفتيش اليومي جاهز</div>
                            <p>اضغط على <strong>"عمل تقرير تفتيش يومي"</strong> لاختيار البنود التي قمت بالتفتيش عليها وتحديد (مطابق / غير مطابق / ملاحظات)، وإضافة لوجو الشركة وتحميل التقرير بصيغة PDF.</p>
                        </div>
                    `}
                </div>
            `;
        }

        // ==================== إدارة بنود التفتيش العامة ====================
        function openChecklistManagerModal() {
            openModal('إدارة بنود التفتيش العامة للمنشأة', `
                <div class="space-y-4 text-xs" dir="rtl">
                    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 text-blue-950 leading-relaxed">
                        أضف بنود التفتيش التي تناسب طبيعة منشأتك أو احذف أي بند غير مناسب. عند عمل تقرير جديد، لن يظهر في التقرير النهائي إلا البنود التي تضع عليها علامة (✓) فقط.
                    </div>

                    <div class="flex gap-2">
                        <input id="new-checklist-item-input" placeholder="اكتب بند تفتيش جديد..." class="flex-1 px-3 py-2 bg-slate-50 border rounded-xl">

        // ==================== ضغط الصور تلقائياً ====================
        function compressImageDataUrl(file, maxWidth = 900, quality = 0.82) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / (img.width || maxWidth));
                        const w = Math.max(1, Math.round((img.width || maxWidth) * scale));
                        const h = Math.max(1, Math.round((img.height || maxWidth) * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const outType = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
                        resolve(canvas.toDataURL(outType, quality));
                    };
                    img.onerror = () => resolve(String(reader.result || ''));
                    img.src = String(reader.result || '');
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

                return;
            }
            box.innerHTML = `

        async function handleDailyReportPhotos(inputEl) {
            const files = inputEl && inputEl.files ? Array.from(inputEl.files).slice(0, 4) : [];
            tempPhotos = [];
            const preview = document.getElementById('dr-photos-preview');
            if (!files.length) {
                if (preview) preview.innerHTML = '';
                return;
            }
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                const compressed = await compressImageDataUrl(file, 800, 0.78);
                if (compressed) tempPhotos.push(compressed);
            }
            if (preview) {
                preview.innerHTML = tempPhotos.map(src => `<img src="${src}" class="w-16 h-16 object-cover rounded-xl border">`).join('');
            }
        }

        // ==================== محرك تصميم وتصدير PDF احترافي عالي الدقة (A4) ====================
        function drawRoundedRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth = 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
            ctx.restore();
        }

        function loadImageSafe(src) {
            return new Promise((resolve) => {
                if (!src) { resolve(null); return; }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function renderProfessionalReportPages(dr) {
            const info = formatShiftDisplay(dr.shiftSystem, dr.shiftSlot);
            const inspected = Array.isArray(dr.inspectedItems) ? dr.inspectedItems : [];
            const photos = Array.isArray(dr.photos) ? dr.photos : [];
            const compliantCount = inspected.filter(x => x.status === 'مطابق').length;
            const nonCompliantCount = inspected.filter(x => x.status === 'غير مطابق').length;
            const complianceRate = inspected.length ? Math.round((compliantCount / inspected.length) * 100) : 100;

            const logoImg = await loadImageSafe(dr.companyLogo);
            const loadedPhotos = [];
            for (const pSrc of photos.slice(0, 4)) {
                const pImg = await loadImageSafe(pSrc);
                if (pImg) loadedPhotos.push(pImg);
            }

            const W = 1240;
            const H = 1754;
            const M = 56;
            const contentW = W - M * 2;
            const pages = [];

            const createNewPage = (pageNum) => {
                const canvas = document.createElement('canvas');
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');

                // خلفية بيضاء نقية وإطار خارجي أنيق للصفحة
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);
                drawRoundedRect(ctx, 28, 28, W - 56, H - 56, 16, '#ffffff', '#cbd5e1', 2);

                // شريط الترويسة الكحلي المتدرج
                const grad = ctx.createLinearGradient(28, 28, W - 28, 195);
                grad.addColorStop(0, '#071538');
                grad.addColorStop(0.6, '#12306b');
                grad.addColorStop(1, '#1b4fa0');
                drawRoundedRect(ctx, 28, 28, W - 56, 168, 14, grad, null);

                // النصوص في الترويسة (محاذاة يمين)
                ctx.textAlign = 'right';
                ctx.fillStyle = '#93c5fd';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('OCCUPATIONAL HEALTH & SAFETY INSPECTION REPORT', W - 62, 68);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 31px sans-serif';
                ctx.fillText('تقرير التفتيش اليومي للسلامة والصحة المهنية', W - 62, 114);

                if (dr.facilityName) {
                    ctx.fillStyle = '#fde68a';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText(String(dr.facilityName), W - 62, 155);
                } else {
                    ctx.fillStyle = '#dbeafe';
                    ctx.font = 'bold 19px sans-serif';
                    ctx.fillText(`كود التقرير: ${dr.id}   •   التاريخ: ${dr.date}`, W - 62, 155);
                }

                // صندوق اللوجو على اليسار داخل الترويسة
                if (logoImg) {
                    const boxW = 210;
                    const boxH = 116;
                    const boxX = 56;
                    const boxY = 54;
                    drawRoundedRect(ctx, boxX, boxY, boxW, boxH, 12, '#ffffff', '#e2e8f0', 2);
                    const scale = Math.min((boxW - 24) / logoImg.width, (boxH - 20) / logoImg.height);
                    const lw = logoImg.width * scale;
                    const lh = logoImg.height * scale;
                    ctx.drawImage(logoImg, boxX + (boxW - lw) / 2, boxY + (boxH - lh) / 2, lw, lh);
                } else {
                    drawRoundedRect(ctx, 56, 62, 175, 100, 12, 'rgba(255,255,255,0.12)', 'rgba(255,255,255,0.35)', 1.5);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#dbeafe';
                    ctx.font = 'bold 16px sans-serif';
                    ctx.fillText('تقرير رسمي', 143, 104);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 22px monospace';
                    ctx.fillText(String(dr.id), 143, 138);
                }

                // تذييل الصفحة برقم الصفحة
                ctx.textAlign = 'center';
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(`نظام إدارة السلامة والصحة المهنية  •  صفحة ${pageNum}`, W / 2, H - 44);

                pages.push(canvas);
                return { canvas, ctx, y: 218 };
            };

            let { ctx, y } = createNewPage(1);

            const wrapLines = (context, text, maxWidth) => {
                const words = String(text || '').split(/\s+/);
                const lines = [];
                let line = '';
                for (const word of words) {
                    const test = line ? `${line} ${word}` : word;
                    if (context.measureText(test).width > maxWidth && line) {
                        lines.push(line);
                        line = word;
                    } else {
                        line = test;
                    }
                }
                if (line) lines.push(line);
                return lines.length ? lines : ['-'];
            };

            // 1. بطاقة المعلومات الأساسية للوردية والتفتيش
            drawRoundedRect(ctx, M, y, contentW, 92, 12, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 19px sans-serif';
            ctx.fillText(`رقم التقرير: ${dr.id}`, W - M - 22, y + 36);
            ctx.fillText(`نظام العمل والوردية: ${info.fullLabel}`, W - M - 22, y + 72);

            ctx.fillText(`تاريخ التفتيش: ${dr.date}`, 540, y + 36);
            ctx.fillText(`القائم بالتفتيش / المرور: ${dr.preparedBy || '-'}`, 540, y + 72);

            y += 110;

            // 2. بطاقات مؤشرات الأداء (KPI Cards)
            const gap = 16;
            const cardW = (contentW - gap * 3) / 4;
            const kpis = [
                { title: 'إجمالي البنود', val: String(inspected.length), bg: '#f8fafc', border: '#cbd5e1', color: '#0d2154' },
                { title: 'مطابق', val: String(compliantCount), bg: '#ecfdf5', border: '#6ee7b7', color: '#047857' },
                { title: 'غير مطابق', val: String(nonCompliantCount), bg: '#fef2f2', border: '#fca5a5', color: '#b91c1c' },
                { title: 'التقييم العام', val: `${dr.rating} (${complianceRate}%)`, bg: '#eff6ff', border: '#93c5fd', color: '#1d4ed8' }
            ];

            kpis.forEach((k, idx) => {
                const cx = W - M - cardW - idx * (cardW + gap);
                drawRoundedRect(ctx, cx, y, cardW, 84, 12, k.bg, k.border, 1.5);
                ctx.textAlign = 'center';
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(k.title, cx + cardW / 2, y + 30);
                ctx.fillStyle = k.color;
                ctx.font = 'bold 23px sans-serif';
                ctx.fillText(k.val, cx + cardW / 2, y + 66);
            });

            y += 108;

            // عنوان جدول التفتيش
            drawRoundedRect(ctx, W - M - 6, y + 2, 6, 26, 3, '#2468c4', null);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('نتائج بنود التفتيش الميداني المحددة', W - M - 18, y + 23);
            y += 38;

            const drawTableHeader = () => {
                drawRoundedRect(ctx, M, y, contentW, 48, 8, '#0d2154', null);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('م', W - M - 28, y + 31);
                ctx.textAlign = 'right';
                ctx.fillText('بند التفتيش', W - M - 72, y + 31);
                ctx.textAlign = 'center';
                ctx.fillText('الحالة', 430, y + 31);
                ctx.textAlign = 'right';
                ctx.fillText('الملاحظات والتوصيات', 330, y + 31);
                y += 48;
            };

            drawTableHeader();

            // صفوف الجدول
            inspected.forEach((it, idx) => {
                ctx.font = 'bold 18px sans-serif';
                const labelLines = wrapLines(ctx, it.label, 560);
                const noteLines = wrapLines(ctx, it.note || 'لا توجد ملاحظات', 255);
                const maxLines = Math.max(labelLines.length, noteLines.length);
                const rowH = Math.max(52, maxLines * 27 + 22);

                if (y + rowH > H - 150) {
                    const next = createNewPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                    drawTableHeader();
                }

                ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                ctx.fillRect(M, y, contentW, rowH);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.2;
                ctx.strokeRect(M, y, contentW, rowH);

                // رقم البند
                ctx.textAlign = 'center';
                ctx.fillStyle = '#334155';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText(String(idx + 1), W - M - 28, y + 32);

                // نص البند
                ctx.textAlign = 'right';
                ctx.fillStyle = '#0f172a';
                labelLines.forEach((ln, li) => {
                    ctx.fillText(ln, W - M - 72, y + 32 + li * 26);
                });

                // شارة الحالة (مطابق / غير مطابق)
                const isOk = (it.status === 'مطابق');
                drawRoundedRect(ctx, 368, y + (rowH - 32) / 2, 124, 32, 16, isOk ? '#d1fae5' : '#fee2e2', isOk ? '#6ee7b7' : '#fca5a5', 1.5);
                ctx.textAlign = 'center';
                ctx.fillStyle = isOk ? '#065f46' : '#991b1b';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(it.status, 430, y + (rowH - 32) / 2 + 22);

                // الملاحظات
                ctx.textAlign = 'right';
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 17px sans-serif';
                noteLines.forEach((nl, ni) => {
                    ctx.fillText(nl, 330, y + 32 + ni * 26);
                });

                y += rowH;
            });

            y += 20;

            // الملاحظات الإضافية العامة
            if (dr.activitiesSummary) {
                ctx.font = 'bold 18px sans-serif';
                const sumLines = wrapLines(ctx, dr.activitiesSummary, contentW - 44);
                const boxH = Math.max(76, sumLines.length * 27 + 46);
                if (y + boxH > H - 150) {
                    const next = createNewPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                }
                drawRoundedRect(ctx, M, y, contentW, boxH, 10, '#eff6ff', '#93c5fd', 1.5);
                drawRoundedRect(ctx, W - M - 6, y, 6, boxH, 3, '#2563eb', null);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#1e3a8a';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('ملاحظات إضافية عامة:', W - M - 20, y + 30);
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 17px sans-serif';
                sumLines.forEach((sl, si) => ctx.fillText(sl, W - M - 20, y + 58 + si * 26));
                y += boxH + 14;
            }

            // تسليم الوردية
            if (dr.handoverNotes) {
                ctx.font = 'bold 18px sans-serif';
                const hoLines = wrapLines(ctx, dr.handoverNotes, contentW - 44);
                const boxH = Math.max(72, hoLines.length * 27 + 44);
                if (y + boxH > H - 150) {
                    const next = createNewPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                }
                drawRoundedRect(ctx, M, y, contentW, boxH, 10, '#fffbeb', '#fcd34d', 1.5);
                drawRoundedRect(ctx, W - M - 6, y, 6, boxH, 3, '#d97706', null);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#92400e';
                ctx.font = 'bold 18px sans-serif';
                ctx.fillText('تسليم الوردية / نقاط المتابعة القادمة:', W - M - 20, y + 30);
                ctx.fillStyle = '#78350f';
                ctx.font = 'bold 17px sans-serif';
                hoLines.forEach((hl, hi) => ctx.fillText(hl, W - M - 20, y + 58 + hi * 26));
                y += boxH + 16;
            }

            // الصور المرفقة إن وجدت
            if (loadedPhotos.length) {
                const imgBlockH = 215;
                if (y + imgBlockH > H - 150) {
                    const next = createNewPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                }
                drawRoundedRect(ctx, W - M - 6, y + 2, 6, 24, 3, '#2468c4', null);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#0d2154';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('التوثيق المصور للجولة الميدانية', W - M - 18, y + 21);
                y += 34;

                const pGap = 14;
                const pW = (contentW - pGap * 3) / 4;
                const pH = 165;
                loadedPhotos.forEach((pImg, pi) => {
                    const px = W - M - pW - pi * (pW + pGap);
                    drawRoundedRect(ctx, px, y, pW, pH, 10, '#f8fafc', '#cbd5e1', 1.5);
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(px + 4, y + 4, pW - 8, pH - 8);
                    ctx.clip();
                    ctx.drawImage(pImg, px + 4, y + 4, pW - 8, pH - 8);
                    ctx.restore();
                });
                y += pH + 20;
            }

            // خانة التوقيعات والاعتماد في أسفل الصفحة الأخيرة
            if (y > H - 185) {
                const next = createNewPage(pages.length + 1);
                ctx = next.ctx;
                y = next.y;
            }
            const sigY = Math.max(y + 12, H - 185);
            const sigW = (contentW - 24) / 2;

            drawRoundedRect(ctx, W - M - sigW, sigY, sigW, 105, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('إعداد (القائم بالتفتيش / القائم بالمرور)', W - M - sigW / 2, sigY + 34);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(`الاسم: ${dr.preparedBy || '......................'}   |   التوقيع: ......................`, W - M - sigW / 2, sigY + 80);

            drawRoundedRect(ctx, M, sigY, sigW, 105, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 17px sans-serif';
            ctx.fillText('اعتماد مدير القسم / مدير السلامة والصحة المهنية', M + sigW / 2, sigY + 34);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('الاسم: ......................   |   التوقيع: ......................', M + sigW / 2, sigY + 80);

            return pages;
        }

        function buildSafePdfFilename(dr) {
            const safeId = String(dr.id || 'report').replace(/[^A-Za-z0-9_-]/g, '');
            const safeDate = String(dr.date || '').replace(/[^0-9-]/g, '');
            return `OHS_Daily_Inspection_${safeId || 'DR'}${safeDate ? '_' + safeDate : ''}.pdf`;
        }

        async function downloadReportPdfFile(reportId = activeStudioReportId) {
            const dr = dailyState.dailyReports.find(x => x.id === reportId);
            if (!dr) return;

            const JsPdfCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
            if (!JsPdfCtor) {
                openReportPdfStudio(reportId);
                printCurrentStudioReport();
                return;
            }

            showToast('جاري تجهيز وتحميل التقرير بصيغة PDF...', 'info');
            try {
                const pages = await renderProfessionalReportPages(dr);
                const pdf = new JsPdfCtor({ unit: 'mm', format: 'a4', orientation: 'portrait' });

                pages.forEach((canvas, idx) => {
                    if (idx > 0) pdf.addPage('a4', 'portrait');
                    const imgData = canvas.toDataURL('image/jpeg', 0.94);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                });

                const filename = buildSafePdfFilename(dr);
                pdf.save(filename);
                showToast('تم تحميل التقرير بصيغة PDF بنجاح ✓', 'success');
            } catch (e) {
                openReportPdfStudio(reportId);
                printCurrentStudioReport();
            }
        }

        // ==================== النوافذ المساعدة ====================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            const m = document.getElementById('modal-container');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('modal-container');
            m.classList.add('hidden'); m.classList.remove('flex');
        }
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = msg;
            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderDailyReports);
    </script>

<script>
(function () {
  if (window.__OHS_AI_BRIDGE_READY__) return;
  window.__OHS_AI_BRIDGE_READY__ = true;

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {
    let base = 'https://ohs-management.ahmed4qhse.workers.dev';
    let token = '';
    try {
      const raw = localStorage.getItem('hse_session_v2') || localStorage.getItem('hse_session_v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.apiBase) base = s.apiBase;
        if (s.token) token = s.token;
      }
    } catch {}

    const res = await fetch(base + '/api/ai', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({
        question: String(question || '').trim(),
        mode: options.mode || 'deep_analysis',
        images: Array.isArray(options.images) ? options.images : []
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
  };
})();
</script>
