        function formatIsoDate(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getCurrentWeekRange() {
            const now = new Date();
            const day = now.getDay();
            const diffFromSaturday = (day + 1) % 7;
            const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffFromSaturday);
            const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6);
            return {
                startStr: formatIsoDate(start),
                endStr: formatIsoDate(end)
            };
        }

        function isDateInCurrentWeek(dateStr) {
            if (!dateStr) return false;
            const wk = getCurrentWeekRange();
            return dateStr >= wk.startStr && dateStr <= wk.endStr;
        }

        function isTaskDueThisWeek(task) {
            if (!task) return false;
            if (isDateInCurrentWeek(task.nextDate)) return true;
            const freq = String(task.frequency || '');
            return freq === 'يومي' || freq === 'أسبوعي';
        }

                    || localStorage.getItem('ohs_labor_law_14_2025_tasks_v2')
                    || localStorage.getItem('ohs_labor_law_14_2025_tasks_v1');
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        tasks: Array.isArray(parsed.tasks) && parsed.tasks.length ? parsed.tasks : getInitialLegalTasks(),
                        measurements: Array.isArray(parsed.measurements) ? parsed.measurements : []
                    };
                }
            } catch (e) {}
            const initial = { tasks: getInitialLegalTasks(), measurements: [] };
            saveLegalTasksState(initial);
            return initial;
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        function getRefBadgeStyle(refStr) {
            if (String(refStr).includes('14')) return 'bg-slate-900 text-white';
            if (String(refStr).includes('248')) return 'bg-red-100 text-red-900 border border-red-200';
            if (String(refStr).includes('249')) return 'bg-amber-100 text-amber-950 border border-amber-200';
            if (String(refStr).includes('250')) return 'bg-blue-100 text-blue-950 border border-blue-200';
            return 'bg-emerald-100 text-emerald-950 border border-emerald-200';
        }

        function evaluateMeasurementAgainstThreshold(std, numericVal) {
            const val = Number(numericVal);
            if (!std || !Number.isFinite(val)) {
                return { status: 'pending', label: 'أدخل قيمة القياس', isExceedance: false, action: std ? std.correctiveAction : '' };
            }
            if (std.direction === 'max') {
                if (val > std.thresholdValue) {
                    return {
                        status: 'high',
                        label: `مرتفع / متجاوز للحد العتبي (${val} > ${std.thresholdValue})`,
                        isExceedance: true,
                        action: std.correctiveAction
                    };
                }
                return {
                    status: 'ok',
                    label: `ضمن الحد العتبي الآمن (${val} ≤ ${std.thresholdValue})`,
                    isExceedance: false,
                    action: 'القياس ضمن الحدود المسموحة؛ استمر في المراقبة الدورية والصيانة الوقائية.'
                };
            } else {
                if (val < std.thresholdValue) {
                    return {
                        status: 'high',
                        label: `منخفض عن الحد العتبي المطلوب (${val} < ${std.thresholdValue})`,
                        isExceedance: true,
                        action: std.correctiveAction
                    };
                }
                return {
                    status: 'ok',
                    label: `ضمن الحد العتبي الآمن (${val} ≥ ${std.thresholdValue})`,
                    isExceedance: false,
                    action: 'القياس مطابق للحد الأدنى المطلوب؛ استمر في الفحص الدوري.'
                };
            }
        }

        function updateEnvThresholdPreview() {
            const selId = document.getElementById('env-std-select')?.value || ENV_THRESHOLD_STANDARDS[0].id;
            const std = ENV_THRESHOLD_STANDARDS.find(x => x.id === selId) || ENV_THRESHOLD_STANDARDS[0];
            const valRaw = document.getElementById('env-val-input')?.value;

            const preBox = document.getElementById('env-pre-threshold-box');
            if (preBox) {
                preBox.innerHTML = `
                    <div class="font-extrabold text-blue-950">الحد العتبي المسبق للقياس: <span class="text-emerald-800">${escapeHtml(std.thresholdDisplay)}</span></div>
                    <div class="text-[11px] text-slate-600 mt-0.5">المرجع: ${escapeHtml(std.reference)} • الوحدة: ${escapeHtml(std.unit)}</div>
                `;
            }

            const evalBox = document.getElementById('env-eval-result-box');
            if (!evalBox) return;

            const hasVal = valRaw !== '' && valRaw !== null && valRaw !== undefined;
            if (!hasVal) {
                evalBox.innerHTML = `
                    <div class="bg-slate-100 text-slate-700 p-3 rounded-xl border text-[11px] font-bold">
                        أدخل نتيجة القياس في الخانة أعلاه ليتم مقارنتها فوراً بالحد العتبي (${escapeHtml(std.thresholdDisplay)}) وتوضيح الإجراء التصحيحي إذا تجاوزت الحدود.
                    </div>
                `;
                return;
            }

            const res = evaluateMeasurementAgainstThreshold(std, Number(valRaw));

                    responsible: (fd.get('responsible') || '').trim(),
                    nextDate: fd.get('nextDate') || today,
                    notes: (fd.get('notes') || '').trim()
                };
                if (ed) {
                    Object.assign(ed, payload);
                    showToast('تم تعديل المهمة ✓', 'success');
                } else {
                    lawState.tasks.unshift({ id: 'LAW-' + Date.now(), done: false, ...payload });
                    showToast('تمت إضافة المهمة ✓', 'success');
                }
                saveLegalTasksState();
                closeModal();
                renderLegalTasks();
            });
        }

        function deleteLawTask(taskId) {
            openConfirmModal('حذف مهمة', 'هل تريد حذف هذه المهمة نهائياً؟', () => {
                lawState.tasks = lawState.tasks.filter(x => x.id !== taskId);
                saveLegalTasksState();
                renderLegalTasks();
                showToast('تم حذف المهمة', 'info');
            });
        }

        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            const m = document.getElementById('modal-container');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('modal-container');
            m.classList.add('hidden'); m.classList.remove('flex');
        }
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = msg;
            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderLegalTasks);
    </script>

<script>
(function () {
  if (window.__OHS_AI_BRIDGE_READY__) return;
  window.__OHS_AI_BRIDGE_READY__ = true;

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {
    let base = 'https://ohs-management.ahmed4qhse.workers.dev';
    let token = '';
    try {
      const raw = localStorage.getItem('hse_session_v2') || localStorage.getItem('hse_session_v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.apiBase) base = s.apiBase;
        if (s.token) token = s.token;
      }
    } catch {}

    const res = await fetch(base + '/api/ai', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({
        question: String(question || '').trim(),
        mode: options.mode || 'deep_analysis',
        images: Array.isArray(options.images) ? options.images : []
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
  };
})();
</script>
