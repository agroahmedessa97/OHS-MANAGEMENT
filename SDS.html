    <script>
        const STORAGE_KEY_SDS = 'ohs_module_sds_clean_v2';
        const SDS_AI_KEY = 'ohs_sds_ai_gemini_key_v1';
        const SDS_AI_MODEL_KEY = 'ohs_sds_ai_gemini_model_v1';
        const EMBEDDED_SDS_API_KEY = '';

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        function loadSdsState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_SDS);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        records: Array.isArray(parsed.records) ? parsed.records : []
                    };
                }
            } catch (e) {}
            return { records: [] };
        }

        let sdsState = loadSdsState();
        let confirmCallback = null;
        let currentUploadedSdsFile = null;

        function saveSdsState() {
            try {
                localStorage.setItem(STORAGE_KEY_SDS, JSON.stringify(sdsState));
            } catch (e) {
                showToast('تعذر الحفظ المحلي بالمتصفح (قد يكون حجم الملف كبيراً)', 'error');
            }
        }

        function getSdsAiKey() {
            try {
                const stored = String(localStorage.getItem(SDS_AI_KEY) || '').trim();
                return stored || EMBEDDED_SDS_API_KEY;
            } catch (e) {
                return EMBEDDED_SDS_API_KEY;
            }
        }
        function setSdsAiKey(k) {
            try { localStorage.setItem(SDS_AI_KEY, String(k || '').trim()); } catch (e) {}
        }
        function getSdsAiModel() {
            try { return String(localStorage.getItem(SDS_AI_MODEL_KEY) || 'gemini-2.5-flash').trim(); } catch (e) { return 'gemini-2.5-flash'; }
        }
        function setSdsAiModel(m) {
            try { localStorage.setItem(SDS_AI_MODEL_KEY, String(m || 'gemini-2.5-flash').trim()); } catch (e) {}
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ==================== عرض سجل صحائف بيانات السلامة (SDS) ====================
        function renderSdsList() {
            const list = sdsState.records;

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl p-4 border card-shadow mb-4 flex flex-wrap justify-between items-center gap-3">
                    <div class="text-sm font-extrabold text-slate-800">صحائف بيانات السلامة المحفوظة (SDS): ${list.length}</div>
                    <button type="button" onclick="openSdsUploadModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs transition">
                        <i class="fa-solid fa-file-arrow-up ml-1"></i>رفع وتحليل ملف SDS
                    </button>
                </div>

                <div class="space-y-4">
                    ${list.map(rec => `
                        <div class="bg-white rounded-2xl p-4 sm:p-5 border card-shadow text-xs space-y-3">
                            <div class="flex flex-wrap justify-between items-center gap-2">
                                <div class="flex flex-wrap items-center gap-2">
                                    <span class="font-mono font-extrabold bg-slate-900 text-white px-2.5 py-1 rounded">${escapeHtml(rec.id)}</span>
                                    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-950 font-black text-sm">اسم المادة: ${escapeHtml(rec.materialName)}</span>
                                    <span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 font-bold">
                                        <i class="fa-solid ${rec.fileKind === 'pdf' ? 'fa-file-pdf text-red-600' : 'fa-file-image text-blue-600'} ml-1"></i>
                                        ${escapeHtml(rec.fileName || 'ملف مرفق')}
                                    </span>
                                </div>
                                <span class="font-mono font-bold text-slate-500">${escapeHtml(rec.date || '')}</span>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                                <div class="bg-blue-50/70 rounded-xl p-3 border border-blue-200 space-y-1.5">
                                    <div class="font-extrabold text-blue-950"><i class="fa-solid fa-hand ml-1 text-blue-600"></i>احتياطات التعامل</div>
                                    <p class="text-slate-800 leading-relaxed">${escapeHtml(rec.handlingPrecautions)}</p>
                                </div>
                                <div class="bg-amber-50/70 rounded-xl p-3 border border-amber-200 space-y-1.5">
                                    <div class="font-extrabold text-amber-950"><i class="fa-solid fa-warehouse ml-1 text-amber-600"></i>احتياطات التخزين</div>
                                    <p class="text-slate-800 leading-relaxed">${escapeHtml(rec.storagePrecautions)}</p>
                                </div>
                                <div class="bg-emerald-50/70 rounded-xl p-3 border border-emerald-200 space-y-1.5">
                                    <div class="font-extrabold text-emerald-950"><i class="fa-solid fa-shield-halved ml-1 text-emerald-600"></i>مهمات الوقاية</div>
                                    <p class="text-slate-800 leading-relaxed">${escapeHtml(rec.ppeRequirements)}</p>
                                </div>
                            </div>

                            <div class="flex justify-between items-center pt-2 border-t">
                                <button type="button" onclick="deleteSdsRecord('${escapeHtml(rec.id)}')" class="px-2.5 py-1.5 rounded-lg bg-red-50 hover:bg-red-600 text-red-600 hover:text-white font-bold transition">
                                    <i class="fa-solid fa-trash-can ml-1"></i>حذف
                                </button>
                                <button type="button" onclick="openEditSdsRecordModal('${escapeHtml(rec.id)}')" class="px-3.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-500 text-amber-900 hover:text-white border border-amber-200 font-bold transition">
                                    <i class="fa-solid fa-pen-to-square ml-1"></i>تعديل
                                </button>
                            </div>
                        </div>
                    `).join('') || `
                        <div class="bg-white rounded-2xl p-10 text-center text-slate-500 text-xs border card-shadow space-y-3">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl mx-auto">
                                <i class="fa-solid fa-flask-vial"></i>
                            </div>
                            <div class="font-extrabold text-sm text-slate-800">لا توجد صحائف بيانات سلامة (SDS) مسجلة حالياً</div>
                            <p>اضغط على <strong>"رفع وتحليل ملف SDS"</strong> وارفع ملف الـ SDS (صورة أو PDF) ليقوم النموذج باستخراج اسم المادة واحتياطات التعامل والتخزين ومهمات الوقاية تلقائياً.</p>
                        </div>
                    `}
                </div>
            `;
        }

        // ==================== استخراج اسم المادة والنقاط الثلاث تلقائياً من الملف ====================
        function translateCommonChemicalNameToArabic(rawName) {
            const s = String(rawName || '').trim();
            if (!s) return 'مادة كيميائية (SDS)';
            const low = s.toLowerCase();

            const dictionary = [
                ['sodium hypochlorite', 'هيبوكلوريت الصوديوم'],
                ['hypochlorite de sodium', 'هيبوكلوريت الصوديوم'],
                ['sulfuric acid', 'حمض الكبريتيك'],
                ['sulphuric acid', 'حمض الكبريتيك'],
                ['acide sulfurique', 'حمض الكبريتيك'],
                ['hydrochloric acid', 'حمض الهيدروكلوريك'],
                ['acide chlorhydrique', 'حمض الهيدروكلوريك'],
                ['nitric acid', 'حمض النيتريك'],
                ['acide nitrique', 'حمض النيتريك'],
                ['sodium hydroxide', 'هيدروكسيد الصوديوم (صودا كاوية)'],
                ['hydroxyde de sodium', 'هيدروكسيد الصوديوم (صودا كاوية)'],
                ['caustic soda', 'صودا كاوية (هيدروكسيد الصوديوم)'],
                ['ethanol', 'إيثانول (كحول إيثيلي)'],
                ['éthanol', 'إيثانول (كحول إيثيلي)'],
                ['methanol', 'ميثانول'],
                ['méthanol', 'ميثانول'],
                ['isopropanol', 'أيزوبروبانول'],
                ['isopropyl alcohol', 'كحول أيزوبروبيلي'],
                ['acetone', 'أسيتون'],
                ['acétone', 'أسيتون'],
                ['toluene', 'تولوين'],
                ['toluène', 'تولوين'],
                ['hydrogen peroxide', 'فوق أكسيد الهيدروجين'],
                ['eau oxygénée', 'فوق أكسيد الهيدروجين'],
                ['ammonia', 'أمونيا'],
                ['ammoniac', 'أمونيا']
            ];

            for (const [enOrFr, ar] of dictionary) {
                if (low.includes(enOrFr)) return ar;
            }
            return s;
        }

        function extractMaterialNameFromText(text, fileName) {
            const cleanFile = String(fileName || '')
                .replace(/\.(pdf|png|jpg|jpeg|webp)$/i, '')
                .replace(/[_-]+/g, ' ')
                .replace(/\bsds\b|\bmsds\b|\bfiche\s*de\s*donnees\s*de\s*securite\b/gi, '')
                .trim();

            if (text && text.trim()) {
                const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 2);
                for (const ln of lines) {
                    const m = ln.match(/(?:product\s*name|material\s*name|substance\s*name|nom\s*du\s*produit|nom\s*de\s*la\s*substance|اسم\s*المادة|اسم\s*المنتج)\s*[:\-–]\s*(.+)/i);
                    if (m && m[1]) {
                        return translateCommonChemicalNameToArabic(m[1].trim().slice(0, 90));
                    }
                }
                const firstMeaningful = lines.find(l => !/safety\s*data\s*sheet|fiche\s*de\s*donn|صحيفة\s*بيانات\s*السلامة|---/i.test(l));
                if (firstMeaningful) return translateCommonChemicalNameToArabic(firstMeaningful.slice(0, 90));
            }

            return translateCommonChemicalNameToArabic(cleanFile) || 'مادة كيميائية (SDS)';
        }

        async function extractTextFromPdfFile(file) {
            if (!window.pdfjsLib) return '';
            try {
                const arrBuf = await file.arrayBuffer();
                const doc = await pdfjsLib.getDocument({ data: arrBuf }).promise;
                const maxPages = Math.min(doc.numPages, 8);
                let out = '';
                for (let p = 1; p <= maxPages; p++) {
                    const page = await doc.getPage(p);
                    const content = await page.getTextContent();
                    const pageStr = content.items.map(it => it.str || '').join(' ');
                    out += `\n--- صفحة ${p} ---\n${pageStr}`;
                    if (out.length > 18000) break;
                }
                return out.slice(0, 18000);
            } catch (e) {
                return '';
            }
        }

        async function renderPdfPagesAsImages(file, maxPages = 2) {
            if (!window.pdfjsLib) return [];
            try {
                const arrBuf = await file.arrayBuffer();
                const doc = await pdfjsLib.getDocument({ data: arrBuf }).promise;
                const pagesToRender = Math.min(doc.numPages, maxPages);
                const images = [];
                for (let p = 1; p <= pagesToRender; p++) {
                    const page = await doc.getPage(p);
                    const viewport = page.getViewport({ scale: 1.4 });
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(viewport.width));
                    canvas.height = Math.max(1, Math.round(viewport.height));
                    const ctx = canvas.getContext('2d');
                    await page.render({ canvasContext: ctx, viewport }).promise;
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                    const b64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : '';
                    if (b64) images.push({ mimeType: 'image/jpeg', data: b64 });
                }
                return images;
            } catch (e) {
                return [];
            }
        }

        function readFileAsBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const res = String(reader.result || '');
                    resolve(res.includes(',') ? res.split(',')[1] : '');
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        function buildSmartFallbackExtraction(fileInfo) {
            const materialName = extractMaterialNameFromText(fileInfo.extractedText || '', fileInfo.fileName || '');
            const combined = `${fileInfo.fileName || ''} ${fileInfo.extractedText || ''} ${materialName}`.toLowerCase();

            let handling = 'تجنب استنشاق الأبخرة أو الغبار وتجنب ملامسة المادة للعين أو الجلد مباشرة، والعمل في مكان جيد التهوية مع الالتزام بالنظافة الشخصية بعد الانتهاء.';
            let storage = 'تُحفظ المادة في عبواتها الأصلية محكمة الغلق في مكان بارد وجاف وجيد التهوية، بعيداً عن مصادر الحرارة أو الشرر أو أشعة الشمس المباشرة وبعيداً عن المواد المتنافرة.';
            let ppe = 'نظارة واقية مناسبة، قفازات مقاومة للمواد الكيميائية، حذاء أمان، وكمامة أو قناع حماية تنفسي حسب طبيعة الأبخرة أو الرذاذ.';

            if (/acid|حمض|هيدروكلور|كبريتيك|نيتريك/i.test(combined)) {
                handling = 'تُضاف الأحماض بحذر إلى الماء وليس العكس لتجنب التفاعل العنيف أو تناثر الرذاذ، مع منع أي تلامس مع الجلد أو العين وتوفير تهوية جيدة أثناء التحضير أو النقل.';
                storage = 'تُخزن في منطقة مخصصة للأحماض ذات أرضية مقاومة للتآكل وأحواض احتواء للانسكابات، بعيداً عن القلويات والمواد العضوية أو القابلة للاشتعال.';
                ppe = 'نظارة حماية كيميائية محكمة، واقي وجه كامل، قفازات مقاومة للأحماض والكيماويات، مريلة واقية، وحذاء أمان.';
            } else if (/solvent|flammable|مذيب|قابل للاشتعال|كحول|تولين|أسيتون|بنزين/i.test(combined)) {
                handling = 'يُمنع منعاً باتاً التدخين أو وجود أي مصدر شرر أو لهب مكشوف أثناء التداول، مع تفريغ الشحنات الاستاتيكية وتأمين تهوية كافية لمنع تراكم الأبخرة القابلة للاشتعال.';
                storage = 'تُخزن في خزائن أو غرف مخصصة للمواد القابلة للاشتعال جيدة التهوية ومؤرضة، بعيداً عن مصادر الحرارة والشرر والمؤكسدات.';
                ppe = 'نظارة واقية، قفازات مقاومة للمذيبات الكيميائية، كمامة أبخرة عضوية عند الحاجة، وحذاء أمان مناسب.';
            } else if (/chlorine|كلور|hypochlorite|هيبوكلوريت/i.test(combined)) {
                handling = 'تجنب استنشاق الغاز أو الأبخرة المتصاعدة وتجنب خلطها مع الأحماض أو الأمونيا أو أي منظفات أخرى نهائياً، مع ضمان تهوية جيدة أثناء التداول.';
                storage = 'تُحفظ في مكان بارد ومظلم وجيد التهوية في عبوات مغلقة جيداً وبعيداً عن الأحماض والمواد العضوية ومصادر الحرارة.';
                ppe = 'نظارة واقية، قفازات مقاومة للكيماويات، كمامة أو قناع تنفس مناسب، وحذاء أمان.';
            }

            return {
                materialName,
                handlingPrecautions: handling,
                storagePrecautions: storage,
                ppeRequirements: ppe
            };
        }

        async function analyzeSdsFileWithAi(fileInfo) {
            const fallback = buildSmartFallbackExtraction(fileInfo);
            const apiKey = getSdsAiKey();
            if (!apiKey && typeof window.ohsAskHighPrecisionAI === 'function') {
                try {
                    const workerPrompt = `اقرأ وثيقة SDS المرفقة (${fileInfo.fileName}) واستخرج بدقة وباللغة العربية الفصحى 4 حقول في صيغة JSON فقط بدون أي نص إضافي:
{"materialName":"اسم المادة بالعربية","handlingPrecautions":"احتياطات التعامل بالتفصيل العملي","storagePrecautions":"احتياطات التخزين بالتفصيل العملي","ppeRequirements":"مهمات الوقاية الشخصية المطلوبة بدقة"}
النص المستخرج:\n${(fileInfo.extractedText || '').slice(0, 12000)}`;
                    const workerImages = (fileInfo.fileKind === 'pdf' && Array.isArray(fileInfo.pdfPageImages) && fileInfo.pdfPageImages.length)
                        ? fileInfo.pdfPageImages.map((im, idx) => ({ name: 'page_' + idx + '.jpg', data: 'data:' + im.mimeType + ';base64,' + im.data }))
                        : (fileInfo.base64Data && fileInfo.mimeType && fileInfo.mimeType.startsWith('image/')
                            ? [{ name: fileInfo.fileName, data: 'data:' + fileInfo.mimeType + ';base64,' + fileInfo.base64Data }]
                            : []);
                    const rawReply = await window.ohsAskHighPrecisionAI(workerPrompt, { mode: 'deep_analysis', images: workerImages });
                    const cleanJson = String(rawReply || '').replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
                    const parsed = JSON.parse(cleanJson);
                    if (parsed && parsed.handlingPrecautions && parsed.storagePrecautions && parsed.ppeRequirements) {
                        return {
                            materialName: String(parsed.materialName || fallback.materialName).trim(),
                            handlingPrecautions: String(parsed.handlingPrecautions).trim(),
                            storagePrecautions: String(parsed.storagePrecautions).trim(),
                            ppeRequirements: String(parsed.ppeRequirements).trim()
                        };
                    }
                } catch (e) {}
                return fallback;
            }
            if (!apiKey) return fallback;

            try {
                const promptText = `أنت نموذج ذكاء اصطناعي متخصص في قراءة وتحليل صحائف بيانات السلامة (SDS / MSDS).
حتى إذا كان الملف المرفق (${fileInfo.fileName}) مكتوباً بالإنجليزية أو الفرنسية أو أي لغة أخرى، يجب أن تكون جميع القيم المستخرجة مكتوبة باللغة العربية الواضحة والمباشرة.
اقرأ الملف واستخرج منه بدقة وباللغة العربية فقط 4 عناصر بصيغة JSON:
1. "materialName": اسم المادة الكيميائية المستخرج من الملف (مترجماً ومكتوباً بالعربية بوضوح).
2. "handlingPrecautions": احتياطات التعامل مع المادة (باللغة العربية).
3. "storagePrecautions": احتياطات تخزين المادة (باللغة العربية).
4. "ppeRequirements": مهمات الوقاية الشخصية المطلوبة للمادة (باللغة العربية).

أعد النتيجة كـ JSON فقط بدون أي نص إضافي أو علامات markdown:
{"materialName":"...","handlingPrecautions":"...","storagePrecautions":"...","ppeRequirements":"..."}`;

                const parts = [{ text: promptText }];
                if (fileInfo.extractedText && fileInfo.extractedText.trim().length > 40) {
                    parts.push({ text: `\nالنص المستخرج من الملف:\n${fileInfo.extractedText}` });
                } else if (fileInfo.fileKind === 'pdf' && Array.isArray(fileInfo.pdfPageImages) && fileInfo.pdfPageImages.length) {
                    fileInfo.pdfPageImages.forEach(imgObj => {
                        parts.push({
                            inlineData: {
                                mimeType: imgObj.mimeType,
                                data: imgObj.data
                            }
                        });
                    });
                } else if (fileInfo.base64Data) {
                    parts.push({
                        inlineData: {
                            mimeType: fileInfo.mimeType,
                            data: fileInfo.base64Data
                        }
                    });
                }

                const modelName = getSdsAiModel() || 'gemini-2.5-flash';
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts }]
                    })
                });

                const data = await res.json();
                const rawReply = String(data?.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
                const cleanJson = rawReply.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
                const parsed = JSON.parse(cleanJson);

                if (parsed && parsed.handlingPrecautions && parsed.storagePrecautions && parsed.ppeRequirements) {
                    return {
                        materialName: String(parsed.materialName || fallback.materialName).trim(),
                        handlingPrecautions: String(parsed.handlingPrecautions).trim(),
                        storagePrecautions: String(parsed.storagePrecautions).trim(),
                        ppeRequirements: String(parsed.ppeRequirements).trim()
                    };
                }
            } catch (e) {}

            return fallback;
        }

        // ==================== نافذة رفع ملف SDS (بدون إدخال اسم المادة يدوياً) ====================
        function openSdsUploadModal() {
            currentUploadedSdsFile = null;
            const today = new Date().toISOString().split('T')[0];

            openModal('رفع وتحليل صحيفة بيانات السلامة (SDS)', `
                <form id="sds-upload-form" class="space-y-4 text-xs" dir="rtl">
                    <div class="bg-blue-50 border border-blue-200 rounded-2xl p-3 text-blue-950 leading-relaxed">
                        ارفع ملف الـ <strong>SDS</strong> (صورة أو PDF) فقط؛ سيستخرج النموذج تلقائياً: <strong>اسم المادة</strong>، <strong>احتياطات التعامل</strong>، <strong>احتياطات التخزين</strong>، و<strong>مهمات الوقاية</strong>.
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center bg-slate-50 p-3.5 rounded-2xl border">
                        <div class="sm:col-span-2">
                            <label class="block font-extrabold text-slate-900 mb-1"><i class="fa-solid fa-paperclip ml-1 text-emerald-600"></i>ملف SDS (صورة أو PDF) *</label>
                            <input type="file" id="sds-file-input" accept="image/*,.pdf,application/pdf" required onchange="handleSdsFileChosen(this)" class="w-full px-2.5 py-2 bg-white border rounded-xl text-xs">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">التاريخ *</label>
                            <input type="date" name="date" value="${today}" required class="w-full px-3 py-2 bg-white border rounded-xl font-mono">
                        </div>
                        <div id="sds-file-status" class="sm:col-span-3 text-[11px] font-bold text-slate-500">لم يتم اختيار ملف بعد.</div>
                    </div>

                    <div id="sds-analysis-result" class="hidden space-y-3 bg-emerald-50/50 p-4 rounded-2xl border border-emerald-200">
                        <div class="font-extrabold text-emerald-950 text-sm"><i class="fa-solid fa-wand-magic-sparkles ml-1 text-emerald-600"></i>النتائج المستخرجة تلقائياً من الملف:</div>
                        <div>
                            <label class="block font-bold mb-1 text-slate-900">اسم المادة المستخرج</label>
                            <input id="res-material-name" name="materialName" readonly class="w-full px-3 py-2 bg-white border rounded-xl font-extrabold text-emerald-900">
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-blue-950">احتياطات التعامل</label>
                            <textarea id="res-handling" name="handlingPrecautions" rows="2" readonly class="w-full px-3 py-2 bg-white border rounded-xl"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-amber-950">احتياطات التخزين</label>
                            <textarea id="res-storage" name="storagePrecautions" rows="2" readonly class="w-full px-3 py-2 bg-white border rounded-xl"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-emerald-950">مهمات الوقاية</label>
                            <textarea id="res-ppe" name="ppeRequirements" rows="2" readonly class="w-full px-3 py-2 bg-white border rounded-xl"></textarea>
                        </div>
                    </div>

                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">إلغاء</button>
                        <button type="submit" id="save-sds-btn" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold">حفظ النتيجة ✓</button>
                    </div>
                </form>
            `);

            document.getElementById('sds-upload-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!currentUploadedSdsFile) {
                    showToast('اختر صورة أو ملف PDF أولاً', 'error');
                    return;
                }

                const fd = new FormData(e.target);
                let matVal = document.getElementById('res-material-name')?.value.trim() || '';
                let handlingVal = document.getElementById('res-handling')?.value.trim() || '';
                let storageVal = document.getElementById('res-storage')?.value.trim() || '';
                let ppeVal = document.getElementById('res-ppe')?.value.trim() || '';

                if (!matVal || !handlingVal || !storageVal || !ppeVal) {
                    const extracted = await analyzeSdsFileWithAi(currentUploadedSdsFile);
                    matVal = extracted.materialName;
                    handlingVal = extracted.handlingPrecautions;
                    storageVal = extracted.storagePrecautions;
                    ppeVal = extracted.ppeRequirements;
                }

                sdsState.records.unshift({
                    id: 'SDS-' + Date.now(),
                    materialName: matVal,
                    date: fd.get('date') || today,
                    fileName: currentUploadedSdsFile.fileName,
                    fileKind: currentUploadedSdsFile.fileKind,
                    handlingPrecautions: handlingVal,
                    storagePrecautions: storageVal,
                    ppeRequirements: ppeVal
                });

                saveSdsState();
                closeModal();
                renderSdsList();
                showToast(`تم استخراج وحفظ بيانات المادة (${matVal}) بنجاح ✓`, 'success');
            });
        }

        async function handleSdsFileChosen(inputEl) {
            const file = inputEl && inputEl.files ? inputEl.files[0] : null;
            if (!file) return;

            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
            const isImage = file.type.startsWith('image/') || /\.(png|jpg|jpeg|webp)$/i.test(file.name);

            if (!isPdf && !isImage) {
                showToast('يرجى رفع ملف صورة أو PDF فقط', 'error');
                inputEl.value = '';
                return;
            }

            const statusEl = document.getElementById('sds-file-status');
            if (statusEl) statusEl.textContent = 'جاري قراءة الملف واستخراج اسم المادة والبيانات...';

            const base64Data = await readFileAsBase64(file);
            const extractedText = isPdf ? await extractTextFromPdfFile(file) : '';
            const pdfPageImages = (isPdf && extractedText.trim().length <= 40)
                ? await renderPdfPagesAsImages(file, 2)
                : [];

            currentUploadedSdsFile = {
                fileName: file.name,
                fileKind: isPdf ? 'pdf' : 'image',
                mimeType: file.type || (isPdf ? 'application/pdf' : 'image/jpeg'),
                base64Data,
                extractedText,
                pdfPageImages
            };

            const result = await analyzeSdsFileWithAi(currentUploadedSdsFile);

            const resBox = document.getElementById('sds-analysis-result');
            if (resBox) resBox.classList.remove('hidden');
            if (document.getElementById('res-material-name')) document.getElementById('res-material-name').value = result.materialName;
            if (document.getElementById('res-handling')) document.getElementById('res-handling').value = result.handlingPrecautions;
            if (document.getElementById('res-storage')) document.getElementById('res-storage').value = result.storagePrecautions;
            if (document.getElementById('res-ppe')) document.getElementById('res-ppe').value = result.ppeRequirements;

            if (statusEl) statusEl.textContent = `تم قراءة الملف (${file.name}) واستخراج اسم المادة والبيانات تلقائياً ✓`;
        }

        function openEditSdsRecordModal(recordId) {
            const rec = sdsState.records.find(x => x.id === recordId);
            if (!rec) return;

            openModal(`تعديل بيانات الصحيفة (${rec.id})`, `
                <form id="edit-sds-form" class="space-y-3 text-xs" dir="rtl">
                    <div>
                        <label class="block font-bold mb-1">اسم المادة *</label>
                        <input name="materialName" value="${escapeHtml(rec.materialName)}" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl font-bold">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">احتياطات التعامل *</label>
                        <textarea name="handlingPrecautions" rows="2" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl">${escapeHtml(rec.handlingPrecautions)}</textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">احتياطات التخزين *</label>
                        <textarea name="storagePrecautions" rows="2" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl">${escapeHtml(rec.storagePrecautions)}</textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">مهمات الوقاية *</label>
                        <textarea name="ppeRequirements" rows="2" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl">${escapeHtml(rec.ppeRequirements)}</textarea>
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">إلغاء</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">حفظ التعديلات ✓</button>
                    </div>
                </form>
            `);

            document.getElementById('edit-sds-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                rec.materialName = fd.get('materialName').trim();
                rec.handlingPrecautions = fd.get('handlingPrecautions').trim();
                rec.storagePrecautions = fd.get('storagePrecautions').trim();
                rec.ppeRequirements = fd.get('ppeRequirements').trim();
                saveSdsState();
                closeModal();
                renderSdsList();
                showToast('تم حفظ التعديلات ✓', 'success');
            });
        }

        function deleteSdsRecord(recordId) {
            openConfirmModal('حذف صحيفة SDS', 'هل تريد حذف هذه الصحيفة نهائياً؟', () => {
                sdsState.records = sdsState.records.filter(x => x.id !== recordId);
                saveSdsState();
                renderSdsList();
                showToast('تم حذف الصحيفة', 'info');
            });
        }

        // ==================== النوافذ المساعدة ====================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            const m = document.getElementById('modal-container');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('modal-container');
            m.classList.add('hidden'); m.classList.remove('flex');
        }
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = msg;
            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderSdsList);
    </script>

<script>
(function () {
  if (window.__OHS_AI_BRIDGE_READY__) return;
  window.__OHS_AI_BRIDGE_READY__ = true;

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {
    let base = 'https://ohs-management.ahmed4qhse.workers.dev';
    let token = '';
    try {
      const raw = localStorage.getItem('hse_session_v2') || localStorage.getItem('hse_session_v1');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.apiBase) base = s.apiBase;
        if (s.token) token = s.token;
      }
    } catch {}

    const res = await fetch(base + '/api/ai', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': 'Bearer ' + token } : {})
      },
      body: JSON.stringify({
        question: String(question || '').trim(),
        mode: options.mode || 'deep_analysis',
        images: Array.isArray(options.images) ? options.images : []
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
  };
})();
</script>
