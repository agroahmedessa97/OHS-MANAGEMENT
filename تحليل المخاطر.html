<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحليل ومصفوفة المخاطر 5×5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Cairo', 'sans-serif'] },
                        colors: {
                            emerald: { 50:'#eff8ff',100:'#dbeefe',200:'#bfe0fc',300:'#8fc7f8',400:'#5aa8ef',500:'#3a8be0',600:'#2468c4',700:'#1b4fa0',800:'#173f80',900:'#12306b',950:'#0b2150' },
                            slate: { 50:'#f4f8fd',100:'#e8f0fa',200:'#d3e0f0',300:'#b3c6de',400:'#8499b8',500:'#5f7497',600:'#475b7e',700:'#2f4468',800:'#16295a',900:'#0d2154',950:'#071538' }
                        }
                    }
                }
            };
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(180deg,#f3f9ff 0%,#e6f1fc 100%) fixed; color: #0d2154; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #dbeafe; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
        .card-shadow { box-shadow: 0 4px 18px rgba(36,104,196,.08); }
        .matrix-cell { transition: transform .15s ease, box-shadow .15s ease; }
        .matrix-cell:hover { transform: scale(1.03); z-index: 10; box-shadow: 0 6px 16px rgba(15,23,42,.22); }
        .pdf-paper-a4 { width: 210mm; min-height: 297mm; max-width: 100%; }
        @media print {
            body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            #toast-container, #app-header, #main-content, #modal-container, #confirm-modal, #pdf-studio-modal { display: none !important; }
            #print-area { display: block !important; position: static !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .print-break-avoid, #print-area tr { break-inside: avoid; page-break-inside: avoid; }
        }
    </style>
    <style>@page { size: A4 portrait; margin: 8mm; }</style>
</head>
<body class="antialiased selection:bg-emerald-500 selection:text-white">

    <div id="toast-container" class="fixed top-4 left-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>
    <div id="print-area" class="hidden bg-white p-4 text-slate-900"></div>

    <!-- الشريط العلوي المباشر لوحدة المخاطر -->
    <header id="app-header" class="bg-slate-900 text-white sticky top-0 z-20 px-4 sm:px-6 py-3.5 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-300 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-table-cells"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-extrabold">تحليل ومصفوفة المخاطر 5×5 (HIRA)</h1>
                    <p class="text-[11px] text-slate-300">أرقام 1 إلى 5 • حساب تلقائي قبل وبعد التحكم • خريطة تركز المخاطر</p>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button type="button" onclick="prepareExportDialog('print')" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition">
                    <i class="fa-solid fa-print ml-1"></i>طباعة
                </button>
                <button type="button" onclick="prepareExportDialog('pdf')" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-file-pdf ml-1"></i>تحميل PDF
                </button>
                <button type="button" onclick="openRiskModal()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs shadow transition">
                    <i class="fa-solid fa-plus ml-1"></i>إضافة بند تحليل مخاطر
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main id="main-content" class="max-w-6xl mx-auto p-4 sm:p-6"></main>

    <!-- النافذة المنبثقة الرئيسية -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-3 sm:p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl max-h-[92vh] flex flex-col overflow-hidden my-auto">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-slate-900">عنوان</h3>
                <button type="button" onclick="closeModal()" class="w-9 h-9 rounded-xl bg-white border border-slate-200 text-slate-500 hover:text-red-600 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="p-5 sm:p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <!-- معاينة الطباعة -->
    <div id="pdf-studio-modal" class="fixed inset-0 z-50 hidden flex-col bg-slate-900/90">
        <div class="bg-slate-950 text-white px-4 sm:px-6 py-3 border-b border-slate-800 flex flex-wrap items-center justify-between gap-2 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-print text-lg"></i></div>
                <div>
                    <h3 class="text-sm font-extrabold">معاينة الطباعة — تحليل ومصفوفة المخاطر</h3>
                </div>
            </div>
            <div class="flex items-center flex-wrap gap-2">
                <button type="button" onclick="printCurrentStudioReport()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-extrabold transition">
                    <i class="fa-solid fa-print ml-1"></i>طباعة الآن
                </button>
                <button type="button" onclick="closePdfStudio()" class="w-9 h-9 rounded-xl bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-auto bg-slate-300/90 p-4 sm:p-8 flex justify-center items-start">
            <div id="pdf-paper-canvas" dir="rtl" class="pdf-paper-a4 bg-white text-slate-900 shadow-2xl rounded-md p-6 sm:p-8" style="font-size: 13px;"></div>
        </div>
    </div>

    <!-- نافذة التأكيد -->
    <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6">
            <h3 id="confirm-title" class="text-lg font-extrabold text-slate-900 mb-2">تأكيد</h3>
            <p id="confirm-message" class="text-sm text-slate-600 mb-6"></p>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeConfirmModal(false)" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">إلغاء</button>
                <button type="button" onclick="closeConfirmModal(true)" class="px-5 py-2 rounded-xl bg-red-600 text-white font-bold text-sm">تأكيد</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY_RISKS = 'ohs_module_risk_matrix_clean_v2';

        const LIKELIHOOD_LEVELS = [
            { val: 5, label: 'أسبوعياً أو أكثر', criteria: 'يقع مرة كل أسبوع أو أكثر أثناء التشغيل' },
            { val: 4, label: 'مرة إلى 3 مرات شهرياً', criteria: 'يقع مرة كل أسبوعين إلى شهر' },
            { val: 3, label: 'مرة كل 3 إلى 6 أشهر', criteria: 'يقع كل ربع أو نصف سنة / موسمي' },
            { val: 2, label: 'مرة في السنة', criteria: 'يقع مرة واحدة خلال السنة' },
            { val: 1, label: 'أقل من مرة سنوياً', criteria: 'لم يقع أو يحدث أقل من مرة كل سنة' }
        ];

        const SEVERITY_LEVELS = [
            { val: 1, label: 'إسعافات فقط / توقف < 1 ساعة', criteria: 'إسعاف أولي بدون غياب، أو تعطيل أقل من ساعة' },
            { val: 2, label: 'غياب 1 – 3 أيام / توقف 1 – 4 ساعات', criteria: 'إصابة تستدعي غياباً من يوم إلى 3 أيام أو توقف محدود' },
            { val: 3, label: 'غياب 4 – 14 يوماً / توقف حتى يوم', criteria: 'إصابة غيابها من 4 إلى 14 يوماً أو توقف نشاط حتى يوم كامل' },
            { val: 4, label: 'غياب > 14 يوماً أو عجز جزئي', criteria: 'إصابة بأكثر من 14 يوماً أو عجز دائم جزئي أو تلف مادي كبير' },
            { val: 5, label: 'وفاة أو عجز كلي أو انهيار شامل', criteria: 'حالة وفاة أو عجز كلي دائم أو أضرار جسيمة واسعة' }
        ];

        function loadRiskModuleState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY_RISKS);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    return {
                        preparedBy: String(parsed.preparedBy || ''),
                        reportDate: String(parsed.reportDate || new Date().toISOString().split('T')[0]),
                        risks: Array.isArray(parsed.risks) ? parsed.risks : []
                    };
                }
            } catch (e) {}
            return {
                preparedBy: '',
                reportDate: new Date().toISOString().split('T')[0],
                risks: []
            };
        }

        let riskState = loadRiskModuleState();
        let confirmCallback = null;
        let activeMatrixFilter = null;
        let exportOptions = {
            includeLogo: false,
            logoDataUrl: '',
            includeFacility: false,
            facilityName: ''
        };

        function saveRiskModuleState() {
            try {
                localStorage.setItem(STORAGE_KEY_RISKS, JSON.stringify(riskState));
            } catch (e) {
                showToast('تعذر الحفظ المحلي بالمتصفح', 'error');
            }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(msg, type = 'info') {
            const c = document.getElementById('toast-container');
            const bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const el = document.createElement('div');
            el.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 pointer-events-auto`;
            el.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i><span>${escapeHtml(msg)}</span>`;
            c.appendChild(el);
            setTimeout(() => el.remove(), 3500);
        }

        // ==================== تصنيف مستوى الخطورة (1 - 25) ====================
        function getRiskMeta(score) {
            const sc = Number(score) || 1;
            if (sc <= 4) {
                return {
                    key: 'low',
                    label: 'ضعيف / بسيط الخطورة',
                    shortLabel: 'بسيط',
                    badge: 'bg-emerald-100 text-emerald-900 border border-emerald-300',
                    cell: 'bg-emerald-500 text-white',
                    hexBg: '#d1fae5',
                    hexBorder: '#6ee7b7',
                    hexText: '#065f46'
                };
            }
            if (sc <= 9) {
                return {
                    key: 'medium',
                    label: 'متوسط الخطورة',
                    shortLabel: 'متوسط',
                    badge: 'bg-amber-100 text-amber-900 border border-amber-300',
                    cell: 'bg-amber-400 text-slate-950',
                    hexBg: '#fef3c7',
                    hexBorder: '#fcd34d',
                    hexText: '#92400e'
                };
            }
            if (sc <= 16) {
                return {
                    key: 'high',
                    label: 'عالي الخطورة',
                    shortLabel: 'عالي',
                    badge: 'bg-orange-100 text-orange-900 border border-orange-300',
                    cell: 'bg-orange-500 text-white',
                    hexBg: '#ffedd5',
                    hexBorder: '#fdba74',
                    hexText: '#9a3412'
                };
            }
            return {
                key: 'critical',
                label: 'كارثي / حرج للغاية',
                shortLabel: 'كارثي',
                badge: 'bg-red-100 text-red-900 border border-red-300',
                cell: 'bg-red-600 text-white',
                hexBg: '#fee2e2',
                hexBorder: '#fca5a5',
                hexText: '#991b1b'
            };
        }

        function getTransitionSummary(initialScore, residualScore) {
            const initMeta = getRiskMeta(initialScore);
            const resMeta = getRiskMeta(residualScore);
            if (residualScore < initialScore) {
                if (initMeta.label === resMeta.label) {
                    return `انخفضت الدرجة من (${initialScore}) إلى (${residualScore}) ضمن نطاق "${resMeta.label}"`;
                }
                return `انخفضت الخطورة من "${initMeta.label}" (${initialScore}) إلى "${resMeta.label}" (${residualScore})`;
            }
            if (residualScore === initialScore) {
                return `بقيت الخطورة عند "${resMeta.label}" (${residualScore}) — يُنصح بتعزيز نقطة التحكم`;
            }
            return `ارتفعت الخطورة من "${initMeta.label}" (${initialScore}) إلى "${resMeta.label}" (${residualScore})`;
        }

        // ==================== العرض الرئيسي: مصفوفة 5×5 + تركز المخاطر + سجل البنود ====================
        function toggleMatrixCellFilter(lVal, sVal) {
            if (activeMatrixFilter && activeMatrixFilter.l === lVal && activeMatrixFilter.s === sVal) {
                activeMatrixFilter = null;
            } else {
                activeMatrixFilter = { l: lVal, s: sVal };
            }
            renderRisks();
        }

        function renderRisks() {
            const totalRisks = riskState.risks.length;

            let lowCount = 0, medCount = 0, highCount = 0, critCount = 0;
            riskState.risks.forEach(r => {
                const sc = Number(r.initialL) * Number(r.initialS);
                const k = getRiskMeta(sc).key;
                if (k === 'low') lowCount++;
                else if (k === 'medium') medCount++;
                else if (k === 'high') highCount++;
                else critCount++;
            });

            let matrixRows = '';
            for (let l = 5; l >= 1; l--) {
                const lObj = LIKELIHOOD_LEVELS.find(x => x.val === l);
                matrixRows += `<tr>
                    <td class="p-2 text-right bg-slate-100 border border-slate-300 font-extrabold text-[11px] text-slate-900 min-w-[175px]">
                        <div><span class="inline-block px-1.5 py-0.5 rounded bg-slate-800 text-white font-bold ml-1">${lObj.val}</span><span>${lObj.label}</span></div>
                        <div class="text-[10px] text-slate-500 font-semibold mt-0.5">${lObj.criteria}</div>
                    </td>`;

                for (let s = 1; s <= 5; s++) {
                    const sc = l * s;
                    const meta = getRiskMeta(sc);
                    const cellRisks = riskState.risks.filter(r => Number(r.initialL) === l && Number(r.initialS) === s);
                    const count = cellRisks.length;
                    const isFiltered = activeMatrixFilter && activeMatrixFilter.l === l && activeMatrixFilter.s === s;

                    matrixRows += `
                        <td onclick="toggleMatrixCellFilter(${l}, ${s})" title="اضغط لتصفية المخاطر في الخلية (${l} × ${s} = ${sc})"
                            class="matrix-cell cursor-pointer border-2 ${isFiltered ? 'border-slate-950 ring-4 ring-blue-400' : 'border-white'} p-2 text-center ${meta.cell} relative select-none">
                            <div class="text-base font-black leading-tight">${sc}</div>
                            <div class="text-[10px] opacity-90 font-bold">${l} × ${s}</div>
                            ${count > 0 ? `
                                <div class="mt-1 inline-flex items-center justify-center px-2 py-0.5 rounded-full bg-slate-950 text-white font-black text-xs shadow">
                                    ${count} ${count === 1 ? 'خطر' : 'أخطار'}
                                </div>
                            ` : `
                                <div class="mt-1 text-[10px] opacity-60">0</div>
                            `}
                        </td>
                    `;
                }
                matrixRows += '</tr>';
            }

            const displayedRisks = activeMatrixFilter
                ? riskState.risks.filter(r => Number(r.initialL) === activeMatrixFilter.l && Number(r.initialS) === activeMatrixFilter.s)
                : riskState.risks;

            document.getElementById('main-content').innerHTML = `
                <!-- بطاقات تركز المخاطر (قبل نقطة التحكم) -->
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5">
                    <div class="bg-white rounded-2xl p-4 border card-shadow text-center">
                        <div class="text-xs font-bold text-slate-500">إجمالي الأخطار</div>
                        <div class="text-2xl font-black text-slate-900 mt-1">${totalRisks}</div>
                    </div>
                    <div class="bg-red-50 rounded-2xl p-4 border border-red-200 text-center">
                        <div class="text-xs font-extrabold text-red-900">كارثي (20 - 25)</div>
                        <div class="text-2xl font-black text-red-700 mt-1">${critCount}</div>
                    </div>
                    <div class="bg-orange-50 rounded-2xl p-4 border border-orange-200 text-center">
                        <div class="text-xs font-extrabold text-orange-900">عالي الخطورة (10 - 16)</div>
                        <div class="text-2xl font-black text-orange-700 mt-1">${highCount}</div>
                    </div>
                    <div class="bg-amber-50 rounded-2xl p-4 border border-amber-200 text-center">
                        <div class="text-xs font-extrabold text-amber-900">متوسط الخطورة (5 - 9)</div>
                        <div class="text-2xl font-black text-amber-700 mt-1">${medCount}</div>
                    </div>
                    <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-200 text-center col-span-2 sm:col-span-1">
                        <div class="text-xs font-extrabold text-emerald-900">بسيط / ضعيف (1 - 4)</div>
                        <div class="text-2xl font-black text-emerald-700 mt-1">${lowCount}</div>
                    </div>
                </div>

                <!-- مصفوفة المخاطر التفاعلية 5×5 + جداول مقاييس (1 - 5) -->
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 mb-6">
                    <div class="lg:col-span-8 bg-white rounded-2xl p-4 sm:p-5 border card-shadow">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
                            <div>
                                <h2 class="font-extrabold text-sm text-slate-900">مصفوفة تقييم المخاطر 5×5 (توزيع الأخطار قبل نقطة التحكم)</h2>
                                <p class="text-[11px] text-slate-500">الأرقام البارزة داخل المربعات توضح عدد الأخطار المسجلة في كل درجة خطورة — اضغط على أي مربع لتصفية بنوده</p>
                            </div>
                            ${activeMatrixFilter ? `
                                <button type="button" onclick="activeMatrixFilter=null; renderRisks();" class="px-3 py-1 rounded-full bg-slate-900 text-white text-[11px] font-bold">
                                    إلغاء التصفية (${activeMatrixFilter.l} × ${activeMatrixFilter.s}) ✕
                                </button>
                            ` : ''}
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse text-center">
                                <thead>
                                    <tr>
                                        <th class="p-2.5 bg-slate-900 text-white text-xs border border-slate-700">الاحتمالية ↓ / الشدة ←</th>
                                        ${SEVERITY_LEVELS.map(sv => `
                                            <th class="p-2 bg-slate-800 text-white text-[11px] border border-slate-700 min-w-[104px]">
                                                <div class="text-amber-300 font-extrabold text-xs">${sv.val}</div>
                                                <div class="leading-snug mt-0.5">${sv.label}</div>
                                            </th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody>${matrixRows}</tbody>
                            </table>
                        </div>
                    </div>

                    <!-- جدولي الاحتمالية والشدة (من 1 إلى 5) -->
                    <div class="lg:col-span-4 bg-white rounded-2xl p-4 sm:p-5 border card-shadow flex flex-col justify-between space-y-4 text-xs">
                        <div>
                            <h3 class="font-extrabold text-sm text-slate-900 mb-2"><i class="fa-solid fa-scale-balanced ml-1 text-blue-600"></i>حدود الاحتمالية والشدة (1 إلى 5)</h3>
                            <div class="text-[11px] font-extrabold text-blue-900 mb-1">الاحتمالية (معدل التكرار الزمني):</div>
                            <table class="w-full border-collapse text-right text-[11px] mb-3">
                                <thead>
                                    <tr class="bg-slate-900 text-white">
                                        <th class="p-1.5 border border-slate-700 text-center w-11">الرقم</th>
                                        <th class="p-1.5 border border-slate-700">الحد الزمني المحدد</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${[5, 4, 3, 2, 1].map(v => {
                                        const lItem = LIKELIHOOD_LEVELS.find(x => x.val === v);
                                        return `
                                            <tr class="odd:bg-slate-50">
                                                <td class="p-1.5 border font-extrabold text-center text-blue-800">${lItem.val}</td>
                                                <td class="p-1.5 border font-bold">${lItem.label} <span class="text-slate-500 font-normal">(${lItem.criteria})</span></td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>

                            <div class="text-[11px] font-extrabold text-emerald-900 mb-1">الشدة (أثر الإصابة أو التوقف):</div>
                            <table class="w-full border-collapse text-right text-[11px]">
                                <thead>
                                    <tr class="bg-slate-900 text-white">

        // ==================== سؤال المستخدم عن اللوجو واسم المنشأة عند الطباعة أو التحميل ====================
        function compressImageDataUrl(file, maxWidth = 450, quality = 0.88) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / (img.width || maxWidth));
                        const w = Math.max(1, Math.round((img.width || maxWidth) * scale));
                        const h = Math.max(1, Math.round((img.height || maxWidth) * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const outType = (file.type === 'image/png') ? 'image/png' : 'image/jpeg';
                        resolve(canvas.toDataURL(outType, quality));
                    };
                    img.onerror = () => resolve(String(reader.result || ''));
                    img.src = String(reader.result || '');
                };
                reader.onerror = () => resolve('');
                reader.readAsDataURL(file);
            });
        }

        // ==================== المعاينة والطباعة و PDF الاحترافي ====================
        function buildRiskPrintableHtml() {
            let lowCount = 0, medCount = 0, highCount = 0, critCount = 0;
            riskState.risks.forEach(r => {
                const k = getRiskMeta(Number(r.initialL) * Number(r.initialS)).key;
                if (k === 'low') lowCount++;
                else if (k === 'medium') medCount++;
                else if (k === 'high') highCount++;
                else critCount++;
            });

            let matrixHtml = '';
            for (let l = 5; l >= 1; l--) {
                const lObj = LIKELIHOOD_LEVELS.find(x => x.val === l);
                matrixHtml += `<tr><td style="border:1px solid #cbd5e1;padding:6px;background:#f1f5f9;font-weight:700;text-align:right;">(${lObj.val}) ${lObj.label}</td>`;
                for (let s = 1; s <= 5; s++) {
                    const sc = l * s;
                    const meta = getRiskMeta(sc);
                    const cnt = riskState.risks.filter(r => Number(r.initialL) === l && Number(r.initialS) === s).length;
                    matrixHtml += `<td style="border:1px solid #cbd5e1;padding:6px;text-align:center;background:${meta.hexBg};color:${meta.hexText};font-weight:800;">
                        <div>${sc}</div>
                        ${cnt > 0 ? `<div style="margin-top:2px;background:#0f172a;color:#fff;border-radius:99px;padding:1px 6px;font-size:10px;display:inline-block;">${cnt} خطر</div>` : ''}
                    </td>`;
                }
                matrixHtml += '</tr>';
            }

            const showFac = exportOptions.includeFacility && exportOptions.facilityName;
            const showLogo = exportOptions.includeLogo && exportOptions.logoDataUrl;

            return `
                <div style="font-family:'Cairo',Arial,sans-serif;direction:rtl;color:#0f172a;background:#ffffff;border:2px solid #0d2154;border-radius:10px;overflow:hidden;">
                    <div style="background:linear-gradient(135deg,#071538 0%,#12306b 65%,#1b4fa0 100%);color:#ffffff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;">

        function openRiskReportStudio() {

            document.getElementById('print-area').innerHTML = canvas.innerHTML;

        // ==================== محرك توليد PDF احترافي (Canvas + jsPDF) ====================
        function drawRoundedRect(ctx, x, y, w, h, r, fillStyle, strokeStyle, lineWidth = 1) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            if (fillStyle) { ctx.fillStyle = fillStyle; ctx.fill(); }
            if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = lineWidth; ctx.stroke(); }
            ctx.restore();
        }

        function loadImageSafe(src) {
            return new Promise((resolve) => {
                if (!src) { resolve(null); return; }
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
        }

        async function renderRiskReportPages() {
            const showLogo = exportOptions.includeLogo && exportOptions.logoDataUrl;
            const showFac = exportOptions.includeFacility && exportOptions.facilityName;
            const logoImg = showLogo ? await loadImageSafe(exportOptions.logoDataUrl) : null;

            const W = 1240;
            const H = 1754;
            const M = 52;
            const contentW = W - M * 2;
            const pages = [];

            let lowCount = 0, medCount = 0, highCount = 0, critCount = 0;
            riskState.risks.forEach(r => {
                const k = getRiskMeta(Number(r.initialL) * Number(r.initialS)).key;
                if (k === 'low') lowCount++;
                else if (k === 'medium') medCount++;
                else if (k === 'high') highCount++;
                else critCount++;
            });

            const createPage = (pageNum) => {
                const canvas = document.createElement('canvas');
                canvas.width = W;
                canvas.height = H;
                const ctx = canvas.getContext('2d');

                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, W, H);
                drawRoundedRect(ctx, 26, 26, W - 52, H - 52, 16, '#ffffff', '#cbd5e1', 2);

                const grad = ctx.createLinearGradient(26, 26, W - 26, 185);
                grad.addColorStop(0, '#071538');
                grad.addColorStop(0.6, '#12306b');
                grad.addColorStop(1, '#1b4fa0');
                drawRoundedRect(ctx, 26, 26, W - 52, 160, 14, grad, null);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#93c5fd';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('HAZARD IDENTIFICATION & RISK ASSESSMENT (5×5 MATRIX)', W - 58, 64);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 30px sans-serif';
                ctx.fillText('سجل تقييم وتحليل المخاطر ومصفوفة 5×5', W - 58, 108);

                if (showFac) {
                    ctx.fillStyle = '#fde68a';
                    ctx.font = 'bold 21px sans-serif';
                    ctx.fillText(String(exportOptions.facilityName), W - 58, 148);
                }

                if (logoImg) {
                    drawRoundedRect(ctx, 52, 48, 200, 114, 12, '#ffffff', '#e2e8f0', 2);
                    const scale = Math.min(176 / logoImg.width, 94 / logoImg.height);
                    const lw = logoImg.width * scale;
                    const lh = logoImg.height * scale;
                    ctx.drawImage(logoImg, 52 + (200 - lw) / 2, 48 + (114 - lh) / 2, lw, lh);
                }

                ctx.textAlign = 'center';
                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(`نظام إدارة السلامة والصحة المهنية  •  صفحة ${pageNum}`, W / 2, H - 42);

                pages.push(canvas);
                return { canvas, ctx, y: 206 };
            };

            let { ctx, y } = createPage(1);

            // شريط البيانات الأساسية
            drawRoundedRect(ctx, M, y, contentW, 52, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText(`تاريخ التقرير: ${riskState.reportDate}`, W - M - 20, y + 33);
            ctx.fillText(`إجمالي الأخطار: ${riskState.risks.length}`, 320, y + 33);
            y += 68;

            // بطاقات تركز المخاطر
            const gap = 14;
            const kW = (contentW - gap * 3) / 4;
            const kpis = [
                { t: 'كارثي (20-25)', v: String(critCount), bg: '#fee2e2', br: '#fca5a5', cl: '#991b1b' },
                { t: 'عالي (10-16)', v: String(highCount), bg: '#ffedd5', br: '#fdba74', cl: '#9a3412' },
                { t: 'متوسط (5-9)', v: String(medCount), bg: '#fef3c7', br: '#fcd34d', cl: '#92400e' },
                { t: 'بسيط (1-4)', v: String(lowCount), bg: '#d1fae5', br: '#6ee7b7', cl: '#065f46' }
            ];
            kpis.forEach((k, i) => {
                const kx = W - M - kW - i * (kW + gap);
                drawRoundedRect(ctx, kx, y, kW, 74, 10, k.bg, k.br, 1.5);
                ctx.textAlign = 'center';
                ctx.fillStyle = k.cl;
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText(k.t, kx + kW / 2, y + 28);
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText(k.v, kx + kW / 2, y + 60);
            });
            y += 94;

            // رسم مصفوفة 5×5 في الصفحة الأولى
            drawRoundedRect(ctx, W - M - 6, y, 6, 24, 3, '#2468c4', null);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('مصفوفة تركز المخاطر 5×5 (توزيع الأخطار قبل نقطة التحكم)', W - M - 16, y + 20);
            y += 32;

            const labelColW = 240;
            const cellW = (contentW - labelColW) / 5;
            const cellH = 54;

            drawRoundedRect(ctx, W - M - labelColW, y, labelColW, 44, 6, '#0d2154', null);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 15px sans-serif';
            ctx.fillText('الاحتمالية ↓ / الشدة ←', W - M - labelColW / 2, y + 28);

            SEVERITY_LEVELS.forEach((sv, si) => {
                const sx = W - M - labelColW - cellW * (si + 1);
                drawRoundedRect(ctx, sx, y, cellW, 44, 6, '#1e293b', '#334155', 1);
                ctx.fillStyle = '#fde68a';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText(String(sv.val), sx + cellW / 2, y + 18);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(sv.label, sx + cellW / 2, y + 37);
            });
            y += 44;

            for (let l = 5; l >= 1; l--) {
                const lObj = LIKELIHOOD_LEVELS.find(x => x.val === l);
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(W - M - labelColW, y, labelColW, cellH);
                ctx.strokeStyle = '#cbd5e1';
                ctx.strokeRect(W - M - labelColW, y, labelColW, cellH);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#0d2154';
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`(${lObj.val}) ${lObj.label}`, W - M - 10, y + 33);

                for (let s = 1; s <= 5; s++) {
                    const sc = l * s;
                    const meta = getRiskMeta(sc);
                    const cnt = riskState.risks.filter(r => Number(r.initialL) === l && Number(r.initialS) === s).length;
                    const cx = W - M - labelColW - cellW * s;

                    ctx.fillStyle = meta.hexBg;
                    ctx.fillRect(cx, y, cellW, cellH);
                    ctx.strokeStyle = '#94a3b8';
                    ctx.strokeRect(cx, y, cellW, cellH);

                    ctx.textAlign = 'center';
                    ctx.fillStyle = meta.hexText;
                    ctx.font = 'bold 17px sans-serif';
                    ctx.fillText(String(sc), cx + cellW / 2, cnt > 0 ? y + 22 : y + 34);

                    if (cnt > 0) {
                        drawRoundedRect(ctx, cx + cellW / 2 - 34, y + 28, 68, 20, 10, '#0f172a', null);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 13px sans-serif';
                        ctx.fillText(`${cnt} خطر`, cx + cellW / 2, y + 43);
                    }
                }
                y += cellH;
            }

            y += 24;

            // جدول بنود تحليل المخاطر
            drawRoundedRect(ctx, W - M - 6, y, 6, 24, 3, '#2468c4', null);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('سجل بنود تحليل المخاطر ونقاط التحكم', W - M - 16, y + 20);
            y += 32;

            const drawRisksTableHeader = () => {
                drawRoundedRect(ctx, M, y, contentW, 44, 6, '#0d2154', null);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 15px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('م', W - M - 22, y + 28);
                ctx.textAlign = 'right';
                ctx.fillText('القسم', W - M - 52, y + 28);
                ctx.fillText('مصدر الخطر', W - M - 210, y + 28);
                ctx.textAlign = 'center';
                ctx.fillText('قبل التحكم', 555, y + 28);
                ctx.textAlign = 'right';
                ctx.fillText('نقطة التحكم', 485, y + 28);
                ctx.textAlign = 'center';
                ctx.fillText('بعد التحكم', 130, y + 28);
                y += 44;
            };

            drawRisksTableHeader();

            const wrapLines = (context, text, maxW) => {
                const words = String(text || '').split(/\s+/);
                const lines = [];
                let cur = '';
                for (const w of words) {
                    const test = cur ? `${cur} ${w}` : w;
                    if (context.measureText(test).width > maxW && cur) {
                        lines.push(cur);
                        cur = w;
                    } else {
                        cur = test;
                    }
                }
                if (cur) lines.push(cur);
                return lines.length ? lines : ['-'];
            };

            riskState.risks.forEach((r, idx) => {
                ctx.font = 'bold 15px sans-serif';
                const deptLines = wrapLines(ctx, r.department, 145);
                const hazLines = wrapLines(ctx, r.hazard, 240);
                const ctrlLines = wrapLines(ctx, r.controlMeasure, 260);
                const maxL = Math.max(deptLines.length, hazLines.length, ctrlLines.length);
                const rowH = Math.max(48, maxL * 23 + 18);

                if (y + rowH > H - 155) {
                    const next = createPage(pages.length + 1);
                    ctx = next.ctx;
                    y = next.y;
                    drawRisksTableHeader();
                }

                ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f8fafc';
                ctx.fillRect(M, y, contentW, rowH);
                ctx.strokeStyle = '#cbd5e1';
                ctx.strokeRect(M, y, contentW, rowH);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#0f172a';
                ctx.fillText(String(idx + 1), W - M - 22, y + 28);

                ctx.textAlign = 'right';
                deptLines.forEach((ln, li) => ctx.fillText(ln, W - M - 52, y + 28 + li * 22));
                hazLines.forEach((ln, li) => ctx.fillText(ln, W - M - 210, y + 28 + li * 22));

                const iS = Number(r.initialL) * Number(r.initialS);
                const rS = Number(r.residualL) * Number(r.residualS);
                const iM = getRiskMeta(iS);
                const rM = getRiskMeta(rS);

                drawRoundedRect(ctx, 502, y + (rowH - 28) / 2, 106, 28, 14, iM.hexBg, iM.hexBorder, 1.2);
                ctx.textAlign = 'center';
                ctx.fillStyle = iM.hexText;
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`${iS} (${iM.shortLabel})`, 555, y + (rowH - 28) / 2 + 19);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#0f172a';
                ctx.font = 'bold 15px sans-serif';
                ctrlLines.forEach((ln, li) => ctx.fillText(ln, 485, y + 28 + li * 22));

                drawRoundedRect(ctx, 77, y + (rowH - 28) / 2, 106, 28, 14, rM.hexBg, rM.hexBorder, 1.2);
                ctx.textAlign = 'center';
                ctx.fillStyle = rM.hexText;
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(`${rS} (${rM.shortLabel})`, 130, y + (rowH - 28) / 2 + 19);

                y += rowH;
            });

            if (y > H - 175) {
                const next = createPage(pages.length + 1);
                ctx = next.ctx;
                y = next.y;
            }
            const sigY = Math.max(y + 16, H - 175);
            const sigW = (contentW - 24) / 2;

            drawRoundedRect(ctx, W - M - sigW, sigY, sigW, 96, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.textAlign = 'center';
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('القائم بالتنفيذ', W - M - sigW / 2, sigY + 32);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('الاسم: ......................   |   التوقيع: ......................', W - M - sigW / 2, sigY + 74);

            drawRoundedRect(ctx, M, sigY, sigW, 96, 10, '#f8fafc', '#cbd5e1', 1.5);
            ctx.fillStyle = '#0d2154';
            ctx.font = 'bold 18px sans-serif';
            ctx.fillText('اعتماد مدير السلامة والصحة المهنية', M + sigW / 2, sigY + 32);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText('الاسم: ......................   |   التوقيع: ......................', M + sigW / 2, sigY + 74);

            return pages;
        }

        async function downloadRiskPdfFile() {
            const JsPdfCtor = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : window.jsPDF;
            if (!JsPdfCtor) {
                openRiskReportStudio();
                printCurrentStudioReport();
                return;
            }

            showToast('جاري تجهيز وتحميل سجل ومصفوفة المخاطر PDF...', 'info');
            try {
                const pages = await renderRiskReportPages();
                const pdf = new JsPdfCtor({ unit: 'mm', format: 'a4', orientation: 'portrait' });

                pages.forEach((canvas, idx) => {
                    if (idx > 0) pdf.addPage('a4', 'portrait');
                    const imgData = canvas.toDataURL('image/jpeg', 0.94);
                    pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
                });

                const safeDate = String(riskState.reportDate || '').replace(/[^0-9-]/g, '');
                pdf.save(`OHS_Risk_Matrix_5x5${safeDate ? '_' + safeDate : ''}.pdf`);
                showToast('تم تحميل ملف تحليل ومصفوفة المخاطر بصيغة PDF ✓', 'success');
            } catch (e) {
                openRiskReportStudio();
                printCurrentStudioReport();
            }
        }

        // ==================== النوافذ المساعدة ====================
        function openModal(title, html) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = html;
            const m = document.getElementById('modal-container');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeModal() {
            const m = document.getElementById('modal-container');
            m.classList.add('hidden'); m.classList.remove('flex');
        }
        function openConfirmModal(title, msg, cb) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = msg;
            confirmCallback = cb;
            const m = document.getElementById('confirm-modal');
            m.classList.remove('hidden'); m.classList.add('flex');
        }
        function closeConfirmModal(ok) {
            const m = document.getElementById('confirm-modal');
            m.classList.add('hidden'); m.classList.remove('flex');
            if (ok && typeof confirmCallback === 'function') confirmCallback();
            confirmCallback = null;
        }

        window.addEventListener('DOMContentLoaded', renderRisks);
    </script>

<script>
(function () {

  window.ohsAskHighPrecisionAI = async function (question, options = {}) {

    try {

        const s = JSON.parse(raw);

      },
      body: JSON.stringify({
        question: String(question || '').trim(),

      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message ? (data.error + ': ' + data.message) : (data.error || 'تعذر الاتصال بالمساعد الذكي'));
    }
    return data.answer || '';
  };
})();
</script>
